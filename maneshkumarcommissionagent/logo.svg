<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Manesh Kumar Commission Agent">
  <title>Manesh Kumar Commission Agent</title>
  <defs>
    <linearGradient id="mkTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E57C4"/>
      <stop offset="0.52" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0C1733"/>
    </linearGradient>
    <linearGradient id="mkGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7D774"/>
      <stop offset="0.55" stop-color="#E3B23C"/>
      <stop offset="1" stop-color="#C8921A"/>
    </linearGradient>
  </defs>
  <!-- Royal-blue tile -->
  <rect width="64" height="64" rx="15" fill="url(#mkTile)"/>
  <!-- Commission agent = the trusted hand between supplier and buyer; the mark is a gold
       shopping bag carrying the "MK" monogram. -->
  <path d="M16.5 24.5h31l-2.6 25.2a3.2 3.2 0 0 1-3.2 2.9H22.3a3.2 3.2 0 0 1-3.2-2.9z" fill="url(#mkGold)"/>
  <path d="M24 24.5v-4.8a8 8 0 0 1 16 0v4.8" fill="none" stroke="url(#mkGold)" stroke-width="3.6" stroke-linecap="round"/>
  <!-- MK monogram punched out of the bag (centred on the bag body: 21.2 → 42.8) -->
  <g transform="translate(32 38.8) scale(0.92) translate(-36.1 -38.8)">
    <path d="M24.3 44.2V33.4h2.7l3.1 5.4 3.1-5.4h2.7v10.8h-2.6v-6.1l-2.5 4.3h-1.4l-2.5-4.3v6.1z" fill="#0C1733"/>
    <path d="M37.9 44.2V33.4h2.7v4.4l3.7-4.4h3.2l-4.2 4.9 4.4 5.9h-3.2l-3-4.1-.9 1v3.1z" fill="#0C1733"/>
  </g>
</svg>
