<!-- SECURITY / CSP TODO (2026-10-28 incident hardening):
     vercel.json is strict JSON, so this note lives here instead of as a
     comment inside vercel.json. The Content-Security-Policy currently keeps
     script-src 'self' 'unsafe-inline' because (a) this pre-paint theme
     bootstrap must stay inline and (b) the markup uses inline onclick/oninput
     handlers throughout. Plan to drop 'unsafe-inline':
       1. replace every inline on*= attribute with addEventListener() in app.js;
       2. then give ONLY this bootstrap a 'sha256-...' source in script-src
          (adding a hash while 'unsafe-inline' is present silently disables
          'unsafe-inline', which would break every inline handler - so step 1
          must land first);
       3. verify with the console test in INCIDENT.md section "Verify".
     Do NOT do this migration in the same change as the incident fix. -->
<script>
/* ---------- NO-FLASH THEME BOOTSTRAP (brand-aware) ----------
   Runs in <head> before the first paint. WHICH brand this shell is, which of
   its looks are dark, and its default look are declared on the <html> tag
   (data-brand / data-themes / data-dark-themes / data-default-theme), so this
   exact snippet ships unchanged in both shells and knows no brand names.
   A theme saved by the OTHER brand simply resolves to this brand's default. */
(function(){
  try{
    var h=document.documentElement;
    var read=function(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } };
    var themes=(h.getAttribute("data-themes")||"").split(",");
    var dark=(h.getAttribute("data-dark-themes")||"").split(",");
    var def=h.getAttribute("data-default-theme")||themes[0]||"lemon";
    var t=String(read("nukto.theme",def));
    if(themes.length && themes.indexOf(t)<0) t=def;
    var w=!!read("nukto.winter",false);
    h.setAttribute("data-theme",t);
    h.className=h.className.replace(/\b(night|frost)\b/g,"").trim();
    if(dark.indexOf(t)>=0) h.className+=" night";
    if(w) h.className+=" frost";
    var m=document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute("content", dark.indexOf(t)>=0
      ? (h.getAttribute("data-color-dark")||"#171513")
      : (h.getAttribute("data-color-light")||"#F6EFE6"));
  }catch(e){}
})();
</script>
