<style>
  :root{
    /* ===========================================================
       MANESH KUMAR COMMISSION AGENT — brand palette
       Royal Blue #1E3A8A (trust/trade) + Gold #D4A017 (value)
       navy #0C1733 · bg #F5F8FD · ink #121C33 · line #DEE6F3
       =========================================================== */
    --primary:#1E3A8A; --primary-d:#152C6B; --primary-l:#E7EDFB;
    --emerald:#1E3A8A; --emerald-d:#152C6B; --emerald-l:#E7EDFB;
    --navy:#0C1733; --navy2:#17264D;
    --bg:#F5F8FD; --card:#ffffff; --ink:#121C33; --ink2:#4C5B78; --muted:#8C9AB5;
    --err:#DC2626; --ok:#15803D; --warn:#B45309; --line:#DEE6F3;
    --teal:#1E3A8A; --amber:#E3B23C; --rose:#C2410C; --indigo:#2E57C4;
    --gold:#D4A017; --gold-d:#A87A0C; --gold-l:#FBF0D2;

    --grad-brand:linear-gradient(100deg,#0C1733 0%,#152C6B 26%,#1E3A8A 54%,#2E57C4 80%,#3E6BE0 100%);

  /* ---------- BRAND LOCKUP ----------------------------------------------
     "MANESH KUMAR" (big) over "COMMISSION AGENT" (small, gold, letter-spaced),
     next to logo.svg — the same file the favicon serves. The stacked lockup is
     what keeps a 24-character business name readable on a 360px phone; a single
     line would either overflow the header or shrink to unreadable type.
     Used in three places: header, footer and (via .alogo) the admin sidebar. */
  .logo{display:flex;align-items:center;gap:10px;white-space:nowrap;text-decoration:none;min-width:0}
  .logo .logo-ico{flex:0 0 auto;object-fit:contain;box-shadow:0 4px 12px rgba(30,58,138,.28)}
  .logo img.logo-ico{width:40px;height:40px;border-radius:10px}

  .brand-sub{font-weight:800;font-size:clamp(8px,.72vw,9.5px);letter-spacing:clamp(1.2px,.2vw,2.6px);line-height:1;color:var(--gold-d);text-transform:uppercase}
  .logo:hover .logo-ico{transform:translateY(-1px);transition:.2s}
  /* Footer sits on navy — invert the lockup colours. */
  .foot-in .logo img.logo-ico{width:38px;height:38px;border-radius:10px}
  .foot-in .brand-main{color:#fff}
  .foot-in .brand-sub{color:var(--gold)}
  /* Boot splash brand moment: the animated shopping-bag loop (SVG, so it stays
     sharp on any screen and honours prefers-reduced-motion from inside the file). */
  .load-brand{position:relative;width:104px;height:104px;margin:10px auto 14px}
  .load-brand img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .load-brand .brand-still{display:none}
  @media (prefers-reduced-motion: reduce){.load-brand .brand-anim{display:none}.load-brand .brand-still{display:block}}
  .load-word{text-align:center;font-weight:900;letter-spacing:.4px;color:var(--primary-d);font-size:17px}
  .load-word small{display:block;font-weight:800;font-size:9.5px;letter-spacing:3px;color:var(--gold-d);margin-top:4px}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
  nav.nav{display:flex;gap:4px;margin-left:6px}
  nav.nav a{padding:8px 12px;border-radius:10px;color:var(--ink2);font-weight:600;font-size:14px;transition:.2s}
  nav.nav a:hover{background:var(--emerald-l);color:var(--emerald-d)}
  .search{flex:1;display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:30px;padding:8px 14px;gap:8px;position:relative}

  .icon-btn:hover{background:var(--emerald-l);transform:translateY(-2px)}
  .badge{position:absolute;top:-6px;right:-6px;background:var(--rose);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;animation:bounce .4s}
  @keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
  .checkout-link{background:var(--primary);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 6px 16px rgba(30,58,138,.4);transition:.2s;white-space:nowrap}
  .checkout-link:hover{transform:translateY(-2px)}
  .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#3E6BE0);color:#fff;display:grid;place-items:center;font-weight:800;border:2px solid #fff;box-shadow:var(--shadow)}
  .user-menu{position:absolute;right:0;top:52px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:240px;max-height:calc(100dvh - 100px);overflow-y:auto;display:none;z-index:60}
  .user-menu.open{display:block}
  .user-menu a{display:flex;gap:10px;align-items:center;padding:12px 16px;font-weight:600;font-size:14px;color:var(--ink2)}
  .user-menu a:hover{background:var(--bg)}
  .wrap{width:100%;max-width:none;margin:0 auto;padding:20px clamp(16px,3vw,40px);min-width:0}
  #app{width:100%;min-width:0}
  .pgrid,.pcard{min-width:0}
  .grid{display:grid;gap:20px}
  /* ---------- HERO (royal blue field, gold accents) ---------- */
  .hero{position:relative;overflow:hidden;border-radius:clamp(18px,3vw,26px);padding:clamp(28px,6vw,52px) clamp(20px,6vw,46px);color:#fff;
        background:var(--grad-brand);box-shadow:var(--shadow-lg);border:1px solid rgba(227,178,60,.22)}
  /* soft light sweep + gold corner glow so the flat gradient gets depth */
  .hero:before{content:"";position:absolute;inset:0;pointer-events:none;
        background:radial-gradient(900px 340px at 88% -20%,rgba(227,178,60,.26),transparent 62%),
                   radial-gradient(700px 300px at 8% 120%,rgba(62,107,224,.34),transparent 60%)}
  .hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;pointer-events:none;background:var(--grad-gold);opacity:.9}
  .hero>*{position:relative;z-index:1}
  .hero h1{font-size:clamp(28px,5.4vw,50px);margin:0 0 6px;letter-spacing:-1px;color:#fff;font-weight:900;line-height:1.1}
  .hero .urdu{font-size:clamp(18px,3.2vw,24px);color:rgba(255,255,255,.9);margin:0 0 12px}
  .hero p{max-width:660px;color:rgba(255,255,255,.94);font-size:clamp(15px,2.4vw,18px);margin:0 0 14px}
  /* the banner line reads like a proper heading, not a tiny caption */
  .hero p.banner-line{font-size:clamp(19px,3.2vw,27px);font-weight:800;letter-spacing:-.3px;line-height:1.3;color:#fff;max-width:780px;margin:0 0 14px}
  .hero p.hero-meta{font-size:clamp(14px,2.2vw,16.5px);color:rgba(255,255,255,.85);margin:0 0 20px}
  /* gold eyebrow above the business name */
  .hero-eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:7px 14px;border-radius:999px;
        background:rgba(227,178,60,.16);border:1px solid rgba(227,178,60,.42);color:#F7D774;
        font-size:clamp(9.5px,1.1vw,11.5px);font-weight:800;letter-spacing:2.4px;text-transform:uppercase}
  .hero-eyebrow .pip{width:7px;height:7px;border-radius:50%;background:var(--grad-gold);box-shadow:0 0 0 3px rgba(227,178,60,.22);animation:pulse 2.4s infinite}
  /* small trust chips under the copy */
  .hero-pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
  .hero-pills span{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700;
        background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(4px)}
  .hero-cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:14px;font-weight:700;border:0;transition:.2s;font-size:15px;cursor:pointer;line-height:1.2}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(0)}
  .btn:focus-visible,.input:focus-visible,.select:focus-visible,.textarea:focus-visible,.chip:focus-visible{outline:none;box-shadow:var(--ring)}
  .btn-primary{background:#fff;color:var(--emerald-d)}
  .btn-emerald{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-d) 100%);color:#fff;box-shadow:0 8px 22px rgba(30,58,138,.32)}
  .btn-emerald:hover{box-shadow:0 12px 28px rgba(30,58,138,.4)}
  .btn-cream{background:#fff;color:var(--primary-d);box-shadow:0 8px 22px rgba(12,23,51,.18)}
  .btn-gold{background:var(--grad-gold);color:#0C1733;box-shadow:0 8px 22px rgba(201,136,31,.35)}
  .btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(4px)}
  .btn-ghost:hover{background:rgba(255,255,255,.24)}
  .btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--ink2)}
  .btn-danger{background:var(--err);color:#fff}
  .sec{margin:38px 0}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
  .sec-head h2{position:relative;font-size:26px;margin:0;letter-spacing:-.5px;padding-left:14px}
  .sec-head h2:before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:5px;height:22px;border-radius:3px;background:var(--grad-gold)}
  .sec-head .sub{color:var(--muted);font-size:13px}
  .cats{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
  .cat{min-width:104px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 8px 14px;transition:.2s;cursor:pointer;flex:0 0 auto}
  .cat:hover{transform:translateY(-4px);border-color:var(--emerald);box-shadow:var(--shadow)}
  .cat .ci{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;margin:0 auto 8px;background:var(--gold-l);color:var(--gold-d);border:1px solid rgba(212,160,23,.3)}
  .cat .cn{font-size:12px;font-weight:700;color:var(--ink)}
  .cat .cn.count{color:var(--muted);font-size:11px;font-weight:600}
  /* Categories page: a single, smooth vertical scroll of every category */
  .cat-list{display:flex;flex-direction:column;gap:10px}
  .cat-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--ink);transition:.2s}
  .cat-row:hover{transform:translateY(-2px);border-color:var(--emerald);box-shadow:var(--shadow)}
  .cat-row .ci{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--gold-l);color:var(--gold-d);border:1px solid rgba(212,160,23,.3);flex:0 0 auto}
  .cat-row .cat-name{display:flex;flex-direction:column;gap:2px;min-width:0}
  .cat-row .cat-name b{font-size:15px}
  .cat-row .cat-name .count{color:var(--muted);font-size:12px}
  .cat-row .arr{margin-left:auto;color:var(--muted);font-weight:700}
  /* Fluid product grid: adapts to any width (TV / desktop / tablet / phone) */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:16px}
  @media(max-width:640px){.pgrid{grid-template-columns:repeat(2,1fr);gap:12px}}
  @media(max-width:360px){.pgrid{grid-template-columns:repeat(2,1fr);gap:10px}}
  /* Category rails (home): each category is ONE row; its products sit in a
     horizontal, swipeable strip of columns. Up/down scroll moves between rows,
     left/right scroll (or swipe) moves within a row. */
  .cat-rail{display:flex;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding:2px 2px 12px}
  .cat-rail::-webkit-scrollbar{height:6px}
  .cat-rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .cat-rail .pcard{flex:0 0 clamp(152px,44vw,200px);scroll-snap-align:start}
  .cat-more{flex:0 0 132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--line);border-radius:16px;color:var(--muted);font-weight:700;font-size:13px;text-align:center;text-decoration:none;background:var(--bg);transition:.2s}
  .cat-more:hover{color:var(--emerald-d);border-color:var(--emerald)}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.25s;position:relative;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)}

  .media-sk{position:absolute;inset:0;display:grid;place-items:center;background:var(--pimg-bg);overflow:hidden}
  .media-sk .sk{position:absolute;inset:0;border-radius:0}
  span.media-sk{position:relative;inset:auto;width:100%;height:100%}
  .pimg img.pimage{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

// The feed contains the same listing repeatedly (sometimes at different prices). Keep
// one customer-facing card, retain every SKU as an alias for old links/orders, and turn
// distinct prices into selectable options instead of showing the product three times.
function consolidateCatalogProducts(){
  PRODUCT_ALIASES={};
  const groups=new Map();
  allProducts().forEach(p=>{ if(!p.hidden){ const k=groupKey(p); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(p); } });
  groups.forEach(group=>{
    if(group.length<2) return;
    const canonical=group.find(p=>p.vars&&p.vars.length) || group[0];
    const options=[]; const optionKeys=new Set();
    const addOption=(label,price)=>{
      const pr=Math.round(Number(price)||0); if(pr<=0) return;
      const key=String(label||"").trim().toLowerCase()+"|"+pr;
      if(optionKeys.has(key)) return; optionKeys.add(key); options.push({la:String(label||"Option "+(options.length+1)),pr});
    };
    (canonical.vars||[]).forEach(v=>addOption(v.la||v.label||"Option "+(options.length+1),v.pr||v.price||canonical.price));
    const simple=group.filter(p=>!(p.vars&&p.vars.length));
    const prices=[...new Set(simple.map(p=>Math.round(Number(p.price)||0)).filter(Boolean))];
    if(simple.length>1 && prices.length>1) prices.forEach((pr,i)=>addOption("Option "+(i+1),pr));
    group.forEach((p,idx)=>{
      if(p===canonical) return;
      PRODUCT_ALIASES[p.id]=canonical.id; p.hidden=true; p.mergedInto=canonical.id;
      canonical.stock=Math.max(Number(canonical.stock)||0,Number(p.stock)||0);
      if(Number(p.cost)>0) canonical.cost=canonical.cost>0?Math.min(canonical.cost,p.cost):p.cost;
      if(p.img && p.img!==canonical.img && !String(p.img).startsWith("data:") && !(canonical.gal||[]).includes(p.img)) canonical.gal=(canonical.gal||[]).concat(p.img);
      (p.gal||[]).forEach(g=>{if(g && !(canonical.gal||[]).includes(g)) canonical.gal=(canonical.gal||[]).concat(g);});
      (p.vars||[]).forEach(v=>addOption(v.la||v.label||"Option "+(options.length+1),v.pr||v.price||p.price));
      if(!(p.vars&&p.vars.length) && simple.length>1 && prices.length<=1) addOption("Option 1",p.price);
    });
    if(options.length>1){ options.sort((a,b)=>a.pr-b.pr || a.la.localeCompare(b.la)); if(options.every(o=>/^Option \d+$/i.test(o.la))) options.forEach((o,i)=>o.la="Option "+(i+1)); canonical.vars=options; canonical.price=options[0].pr; }

  });

function shuffleProducts(){
  // Deliberately do not persist the seed: a fresh page load gets a fresh order.
  // Test-only escape hatch (headless harness sets NUKTO_NO_SHUFFLE=1 so every run
  // asserts the same order). Browsers have no process.env, so live shuffle is unchanged.
  try{ if(typeof process!=="undefined"&&process.env&&process.env.NUKTO_NO_SHUFFLE) return; }catch(e){}

function buildCategories(){
  const m = {};

    if(p.hidden) return;
    if(!m[p.cat]) m[p.cat] = { id:p.cat, slug:p.cat, name:p.catLabel, emoji:p.emoji, count:0 };
    m[p.cat].count++;
  });
  // admin-created categories (persist, even with 0 products)
  customCategories.forEach(c=>{
    if(!m[c.slug]) m[c.slug] = { id:c.slug, slug:c.slug, name:c.name, emoji:c.emoji||"📦", count:0, custom:true };
  });
  let list = Object.values(m);
  // rename via admin override (applies everywhere the category is listed)
  list.forEach(c=>{ const o=catOverrides[c.slug]; if(o){ if(o.name) c.name=o.name; if(o.emoji) c.emoji=o.emoji; } });
  // hide categories an admin deleted
  if(hiddenCategories.length){ const hid=new Set(hiddenCategories); list=list.filter(c=>!hid.has(c.slug)); }
  return list.sort((a,b)=>b.count-a.count);
}

const _revCache = {}, _rateCache = {};
function reviewsFor(id){
  if(_revCache[id]) return _revCache[id];
  let seed=0; for(let i=0;i<id.length;i++) seed=(seed*31 + id.charCodeAt(i))>>>0;
  const seededRand=()=>{ seed=(seed*1103515245+12345)>>>0; return seed/4294967296; };
  const n=5+Math.floor(seededRand()*8); // 5–12
  const out=[];
  for(let i=0;i<n;i++){
    // realistic spread: average ~3 (2–4 ke beech), kuch 1–2 star bhi — har product alag
    let base=2.0 + seededRand()*2.3;          // 2.0–4.3 → average ≈ 3.1
    let rating=Math.min(5,Math.round(base*2)/2);
    if(seededRand()<0.09) rating=1;           // occasional 1-star (real reviews mein hota hai)
    out.push({
      name: REVIEW_NAMES[Math.floor(seededRand()*REVIEW_NAMES.length)],
      rating,
      date: new Date(Date.now() - Math.floor(seededRand()*60)*864e5).toISOString().slice(0,10),
      text: REVIEW_TEXTS[Math.floor(seededRand()*REVIEW_TEXTS.length)],
    });
  }
  _revCache[id]=out;
  return out;
}
function avgRating(id){ if(_rateCache[id]!=null) return _rateCache[id]; const r=reviewsFor(id); const v=r.reduce((a,x)=>a+x.rating,0)/r.length; _rateCache[id]=v; return v; }

// Hot sellers: quality + popularity + good price + trending (used for guests & feed start)
function hotScore(p){
  let s = avgRating(p.id)*3;
  s += Math.min(4, reviewsFor(p.id).length/8);       // popularity
  if(p.t) s+=3; if(p.g) s+=1.5; if(p.m) s+=1; if(p.c) s+=0.5;
  if(p.price>0 && p.price<2500) s+=1;                 // good price
  if(p.price>0 && p.price/p.cost>=2) s+=0.5;          // good margin/quality
  if(p.stock===0) s-=6;
  return s;
}
function hotSelling(n){ n=n||12; return [...allProducts()].filter(p=>p.stock>0).sort((a,b)=>hotScore(b)-hotScore(a)).slice(0,n); }
// social proof + stock-urgency labels
function socialProof(p){
  const bought = reviewsFor(p.id).length + (p.price>0? Math.min(120, Math.round((9804/(p.price||1)) + (p.m?12:0))) : 0);
  const inCart = (analytics.addToCart[p.id]||0) || Math.min(9, 1 + (p.t||0) + (p.c||0) + (p.m||0));
  return { bought, inCart };
}

// High-selling threshold (top ~12% best sellers — deterministic, stable per session)
function hsScore(p){ return p.stock>0 ? hotScore(p) : -999; }
let _HS_SET=null;
function hsset(){ if(_HS_SET) return _HS_SET; _HS_SET=new Set([...allProducts()].sort((a,b)=>hotScore(b)-hotScore(a)).slice(0,Math.max(1,Math.floor(PRODUCTS.length*0.12))).map(p=>p.id)); return _HS_SET; }
function productTags(p){ const s=hsset(); return TAGS.filter(t=>{ if(t.id==="hosell") return s.has(p.id); return t.test(p); }).map(t=>t.id); }

function productsForTag(id){
  if(id==="hosell"){ const s=hsset(); return [...allProducts()].filter(p=>s.has(p.id)); }
  const t=getTag(id); const re=id==="winter"?WINTER_RE:(id==="special"?SPECIAL_RE:null);
  if(!t) return [];
  return allProducts().filter(p=>re ? re.test(p.name) : t.test(p));

// Personalized for a signed-in user, based on gender + age group + quality
function recommendProducts(n){
  n=n||12;
  if(!user) return hotSelling(n);
  const G=(user.gender||"Other"), A=(user.ageGroup||"Adult");
  const map=new Map();
  allProducts().forEach(p=>{
    let s=0;
    if(G==="Female"){ if(["beauty","fashion","gifts","home","kids","pets"].includes(p.cat)) s+=3; if(p.m||p.t) s+=1; }
    else if(G==="Male"){ if(["gadgets","automotive","tools","other"].includes(p.cat)) s+=3; if(p.g||p.t) s+=1; }
    else { if(p.t) s+=1; }
    if(A==="Teenager"){ if(["gadgets","fashion","kids","books"].includes(p.cat)) s+=2; if(p.t||p.g) s+=1; }
    else if(A==="Kid"){ if(["kids","pets","books"].includes(p.cat)) s+=3; }
    else if(A==="Senior"){ if(["home","beauty","islamic","pets"].includes(p.cat)) s+=2; }
    else { if(["home","beauty","automotive","gadgets","fashion"].includes(p.cat)) s+=1; }
    s += avgRating(p.id);                        // quality
    s += Math.min(3, reviewsFor(p.id).length/10);// popularity
    if(p.price>0 && p.price<3000) s+=0.5;        // good price
    if(p.t) s+=2; if(p.g||p.m) s+=1;
    map.set(p.id, s + hotScore(p));              // blend with hot-selling signal
  });
  return [...allProducts()].filter(p=>p.stock>0).sort((a,b)=>map.get(b.id)-map.get(a.id)).slice(0,n);
}
// Products similar to a given one (same category + shared flags), best-rated first
function similarTo(id){
  const p=prod(id); if(!p) return [];
  const same=allProducts().filter(x=>x.id!==id && x.cat===p.cat && x.stock>0)
    .sort((a,b)=>avgRating(b.id)-avgRating(a.id));
  if(same.length>=12) return same.slice(0,12);
  const flags=allProducts().filter(x=>x.id!==id && x.cat!==p.cat && x.stock>0 &&
    ((p.g&&x.g)||(p.c&&x.c)||(p.t&&x.t)||(p.m&&x.m)))
    .sort((a,b)=>avgRating(b.id)-avgRating(a.id));
  return [...same, ...flags].slice(0,12);
}

/* ---------- CLEAN PRODUCT URLs (slugs) ----------
   Pehle URL me supplier ki internal key nazar aati thi:
       #product:hhc-3764030
   Ab product ka naam slug ban kar aata hai, aur aakhir me ek chhota
   non-guessable code lagta hai taake do same-naam products alag rahein:
       #product:astronaut-galaxy-star-projector-lamp-p7k2m9
   AHEM: andar ka `p.id` bilkul nahi badla. Catalog, cart, orders,
   wishlist, analytics — sab wahi purani key use karte hain, is liye
   purana data safe hai aur purane links bhi chalte rehte hain. */
function slugify(str){
  return String(str||"").toLowerCase()
    .replace(/&[a-z]+;/g," ")          // HTML entities
    .replace(/[^a-z0-9]+/g,"-")        // non-alnum -> dash
    .replace(/^-+|-+$/g,"")
    .slice(0,60).replace(/-+$/,"");
}
// internal id -> chhota stable code (base36 hash). Supplier ka number
// isse wapas nikalna mumkin nahi, aur har product ke liye unique rehta hai.
function idCode(id){
  let h = 2166136261;
  const str = String(id);
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36).slice(0,6).padStart(6,"0");
}
let _slugMap = null;
function slugMap(){
  if(_slugMap) return _slugMap;
  _slugMap = Object.create(null);
  for(const p of PRODUCTS) _slugMap[productSlug(p)] = p.id;
  return _slugMap;
}
function invalidateSlugMap(){ _slugMap = null; }
function productSlug(p){
  if(!p) return "";
  const base = slugify(decodeHTML(p.name)) || "product";
  return base + "-" + idCode(p.id);
}
// slug YA purani raw id — dono se product mil jata hai (backward compatible)
function resolveProduct(arg){
  const a = String(arg||"");
  if(!a) return null;
  const direct = prod(a);            // purane links: #product:hhc-123
  if(direct) return direct;
  const id = slugMap()[a];
  if(id) return prod(id);
  const m = a.match(/-([a-z0-9]{6})$/);   // naam badal gaya ho to code se dhoondo
  if(m){ const hit = PRODUCTS.find(x=>idCode(x.id)===m[1]); if(hit) return hit; }
  return null;
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

   no plus, no leading zero. Owners type the local form ("03420286170") and older
   builds stored "9203420286170" (92 glued onto the leading 0) — both are repaired
   here so every WhatsApp link on the site resolves. */
function waNumber(raw){
  let d = String(raw==null?"":raw).replace(/\D/g,"");
  if(!d) return "";
  if(d.indexOf("0092")===0) d = d.slice(2);            // 0092... -> 92...
  if(d.indexOf("920")===0 && d.length===13) d = "92"+d.slice(3); // 920342... -> 92342...
  if(d.charAt(0)==="0") d = "92"+d.slice(1);           // 0342...  -> 92342...
  else if(d.length===10 && d.charAt(0)==="3") d = "92"+d;        // 342...   -> 92342...
  return d;
}

async function sbInsert(t, rows){

async function sbUpsert(t, rows){

  catch(e){ return {ok:false}; }
}
async function sbDelete(t, q){

}

/* ============================================================
   GLOBAL STOREFRONT SYNC — admin publish → Supabase → all devices pull
   MASLA THA: admin edits (price/stock/name/discount/variants, deletes,
   custom products/categories, coupons, banner/settings) sirf admin ke
   browser (localStorage) me rehte thay — customers ko nazar nahi aate thay.
   AB: Publish → storefront-sync Edge Function (service_role) sanitized
   snapshot ko public tables me likhti hai → har device boot par pull karta hai.
   Kya sync hota hai: names/prices/stock/images/descriptions/gallery/
   variants/discounts, deletes (tombstones), custom products + categories,
   coupons (uses server-owned), banner + storefront settings.
   Kya KABHI sync nahi hota: cost/store (supplier info — yahan strip hoti
   hai + server par whitelist hai), users/orders/carts/wallets/passwords,
   team/sessions, aur koi bhi API key ya secret.
   ============================================================ */
const SETTING_SYNC_KEYS = ["storeName","tagline","banner","deliveryFee","deliveryFreeAbove","deliveryNote","supportEmail","phone","whatsapp","easypaisa","jazzcash"];
const SYNC_PROD_COLS = "id,name,cat,cat_label,emoji,price,img,description,stock,data,edited,updated_at";
// prodEdit key → canonical id (hidden merge-alias rows canonical par fold hote hain,
// taake cloud me dangling alias rows na banein jo pull par "custom" ban kar zinda hon)
function canonSyncId(id){ return PRODUCT_ALIASES[String(id||"")] || String(id||""); }
// Single product → publish-safe patch. cost/store/supplier fields yahan
// jaan-boojh kar NAHI liye — Edge Function bhi unhe whitelist se drop karti hai.
function cleanSyncProduct(id, src, withStock){
  const o = { id: String(id) };
  if(src.name != null) o.name = String(src.name).slice(0,200);
  if(src.price != null && isFinite(Number(src.price))) o.price = Math.round(Number(src.price));
  if(withStock && src.stock != null && isFinite(Number(src.stock))) o.stock = Math.max(0, Math.round(Number(src.stock)));
  if(src.img != null) o.img = String(src.img).slice(0,2000);
  if(src.desc != null) o.description = String(src.desc).slice(0,5000);
  else if(src.description != null) o.description = String(src.description).slice(0,5000);
  if(src.cat != null) o.cat = String(src.cat).slice(0,80);
  if(src.catLabel != null) o.cat_label = String(src.catLabel).slice(0,120);
  else if(src.cat_label != null) o.cat_label = String(src.cat_label).slice(0,120);
  if(src.emoji != null) o.emoji = String(src.emoji).slice(0,16);
  if(Array.isArray(src.gal)) o.gal = src.gal.filter(u=>u).slice(0,12).map(u=>String(u).slice(0,2000)); // [] = explicit clear
  if(Array.isArray(src.vars)) o.vars = src.vars.slice(0,50).map(v=>({la:String(v.la||v.label||"").slice(0,160), pr:Math.round(Number(v.pr!=null?v.pr:v.price)||0)})).filter(v=>v.la); // [] = explicit clear
  return o;
}
function buildStorefrontPayload(){
  const byId = {};
  // custom base FIRST, explicit prodEdit patches SECOND (fresh edits win over
  // the possibly-stale custom snapshot; stock survives only when stock-dirty)
  customProducts.forEach(cp => {
    if(!cp || !cp.id) return;
    const c = canonSyncId(cp.id);
    byId[c] = Object.assign(byId[c]||{id:c}, cleanSyncProduct(c, cp, true), {id:c});
  });
  Object.entries(prodEdit).forEach(([id, e]) => {
    if(!e || typeof e !== "object") return;
    const c = canonSyncId(id);
    const keepStock = stockDirty.has(String(id))||stockDirty.has(c);
    const merged = Object.assign(byId[c]||{id:c}, cleanSyncProduct(c, e, keepStock), {id:c});
    if(!keepStock) delete merged.stock; // stale base stock must never ride along
    byId[c] = merged;
  });
  const products = Object.values(byId).map(e => {
    // discount hamesha explicit (0 = server par purani discount clear). uses/ratios kabhi nahi.
    e.discount = Math.max(0, Math.min(90, Number(productDiscounts[e.id])||0));
    return e;
  });
  const tombstones = [...new Set(deletedIds.map(canonSyncId))];
  const couponsOut = coupons.filter(c=>c&&c.code).slice(0,500).map(c=>({
    code: String(c.code).trim().toUpperCase(),
    type: (c.type==="flat"||c.type==="ship")?c.type:"pct",
    value: Number(c.value)||0, min_order: Number(c.minOrder)||0,
    active: c.active!==false, max_uses: Number(c.maxUses)||0,
    expiry: c.expiry||"", start: c.start||"", note: String(c.note||"").slice(0,500)
    // NOTE: `uses` count server-owned hai (orders par +1) — bhejte hi nahi.
  }));
  const settingsOut = {};
  SETTING_SYNC_KEYS.forEach(k => { settingsOut[k] = settings[k]; });
  return {
    products, tombstones,
    stockIds: [...new Set([...stockDirty].map(canonSyncId))],
    coupons: couponsOut,
    couponGraves: [...new Set((couponGraves||[]).map(c=>String(c).trim().toUpperCase()))].slice(0,500),
    settings: settingsOut,
    categories: { custom: customCategories||[], hidden: hiddenCategories||[], overrides: catOverrides||{} }
  };
}

async function publishStorefront(){
  const tok = adminSyncToken();
  if(!tok){ toast("Pehle sync token save karein (neeche) 🔑"); return {ok:false, why:"no-token"}; }
  if(!supabase.url){ toast("Supabase connect nahi ❌"); return {ok:false, why:"no-cloud"}; }
  toast("Publishing to all devices... 🌍");
  try{
    const r = await fetch(supaFn("storefront-sync"), {
      method: "POST",
      headers: {"Content-Type":"application/json","x-admin-token":tok},
      body: JSON.stringify(Object.assign({action:"publish", v:1}, buildStorefrontPayload()))
    });

    if(r.ok && d && d.ok){
      store.del("nukto.storefrontDirty"); stockDirty = new Set(); store.del("nukto.stockDirty");
      store.set("nukto.storefrontPublishedAt", new Date().toISOString());

      return {ok:true, counts:d.counts};
    }
    toast("Publish failed: "+((d&&d.error)||("HTTP "+r.status))+" ❌");
    return {ok:false, why:((d&&d.error)||("HTTP "+r.status))};
  }catch(e){ toast("Network issue — publish nahi hua ❌"); return {ok:false, why:"network"}; }
}
// Har device boot par (best-effort). Admin ke unpublished edits mehfooz: dirty ho to skip.
async function pullStorefront(manual){
  if(!supabase.url || !supabase.key) return {ok:false, why:"no-cloud"};
  if(isStorefrontDirty()){
    if(manual) toast("Pehle Publish karein — unpublished changes pull se mehfooz hain ⚠️");
    else console.info("[sync] pull skipped: unpublished admin changes present");
    return {ok:false, why:"dirty"};
  }
  try{
    const get = async (t, q) => { const r = await sbSelect(t, q); if(!r.ok) throw new Error("pull "+t+" failed"); return r.data||[]; };
    const rows = await get("nukto_products", "edited=eq.true&select="+encodeURIComponent(SYNC_PROD_COLS)+"&limit=12000");
    let oos = [];
    try{ oos = await get("nukto_products", "select=id&stock=lte.0&limit=5000"); }catch(e){ oos = []; }
    const srows = await get("nukto_settings", "select=setting_key,value&limit=200");
    const crows = await get("nukto_coupons", "select=code,type,value,min_order,active,uses,max_uses,expiry,note,start_date,per_user,max_discount&limit=500");
    applyStorefrontPull({products:rows, oos:oos, settings:srows, coupons:crows});
    store.set("nukto.storefrontPulledAt", new Date().toISOString());
    if(manual) toast("Latest storefront pulled ✅");
    return {ok:true};
  }catch(e){
    console.info("[sync] pull offline, using local:", e && e.message);
    if(manual) toast("Pull nahi ho saka — offline? ❌");
    return {ok:false, why:"offline"};
  }
}
function applyStorefrontPull(cloud){
  const baseIds = new Set(RAW.map(p => p.id || p.sku).filter(Boolean));
  (cloud.products||[]).forEach(r => {
    if(!r || !r.id) return;
    const id = String(r.id);
    const data = (r.data && typeof r.data === "object") ? r.data : {};
    if(data.deleted === true){ // tombstone: har device par ghaib (+ server par unorderable)
      if(!deletedIds.includes(id)) deletedIds.push(id);
      delete prodEdit[id];
      customProducts = customProducts.filter(x=>x.id!==id);
      delete productDiscounts[id];
      return;
    }
    const patch = {};
    if(r.name != null) patch.name = String(r.name);
    if(r.price != null && isFinite(Number(r.price))) patch.price = Math.round(Number(r.price));
    if(r.stock != null && isFinite(Number(r.stock))) patch.stock = Math.max(0, Math.round(Number(r.stock)));
    if(r.img != null) patch.img = String(r.img);
    if(r.description != null) patch.desc = String(r.description);
    if(r.cat != null) patch.cat = String(r.cat);
    if(r.cat_label != null) patch.catLabel = String(r.cat_label);
    if(r.emoji != null) patch.emoji = String(r.emoji);
    if(Array.isArray(data.gal)) patch.gal = data.gal.filter(u=>u).slice(0,12).map(String);
    if(Array.isArray(data.vars)) patch.vars = data.vars.slice(0,50).filter(v=>v&&(v.la||v.label)).map(v=>({la:String(v.la||v.label).slice(0,160), pr:Math.round(Number(v.pr!=null?v.pr:v.price)||0)}));
    prodEdit[id] = Object.assign(prodEdit[id]||{}, patch);
    const d = Math.max(0, Math.min(90, Number(data.discount)||0));
    if(d > 0) productDiscounts[id] = d; else delete productDiscounts[id];
    if(!baseIds.has(id)){ // admin-added product (catalog.js me nahi)
      const cp = customProducts.find(x=>x.id===id);
      if(cp) Object.assign(cp, patch);
      else customProducts.push(Object.assign({id, cat:"other", catLabel:"Other", emoji:"📦", cost:0, price:0, stock:0, img:"", desc:"", gal:[], vars:[], new:0}, patch));
    }
  });
  // OOS ephemeral hai — prodEdit/publish ka hissa NAHI (restock par khud clear)
  cloudOOS = new Set((cloud.oos||[]).map(r=>r && r.id).filter(Boolean).map(String));
  store.set("nukto.cloudOOS", [...cloudOOS]);
  const byKey = {};
  (cloud.settings||[]).forEach(r => { if(r && r.setting_key) byKey[r.setting_key] = r.value; });
  SETTING_SYNC_KEYS.forEach(k => {
    if(byKey[k] === undefined) return;
    if(k==="deliveryFee"||k==="deliveryFreeAbove"){ const n = Number(byKey[k]); if(isFinite(n)) settings[k] = Math.round(n); }
    else settings[k] = String(byKey[k]);
  });
  // cloud pull ke baad bhi purana brand wapas na aa jaye (rebrand self-heal)
  if(/@nukt[ao]\.shop$/i.test(settings.supportEmail||"")) settings.supportEmail=SUPPORT_EMAIL;
  if(/^Nukt[ao]\.Shop$/i.test(settings.storeName||"")) settings.storeName=STORE_NAME;
  const asJSON = (v, fb) => { try{ const j = JSON.parse(v); return j==null?fb:j; }catch(e){ return fb; } };
  if(byKey.customCategories !== undefined){ const v = asJSON(byKey.customCategories, null); if(Array.isArray(v)) customCategories = v.filter(c=>c&&c.slug).slice(0,500); }
  if(byKey.hiddenCategories !== undefined){ const v = asJSON(byKey.hiddenCategories, null); if(Array.isArray(v)) hiddenCategories = v.filter(x=>typeof x==="string").slice(0,500); }
  if(byKey.catOverrides !== undefined){ const v = asJSON(byKey.catOverrides, null); if(v && typeof v==="object" && !Array.isArray(v)) catOverrides = v; }
  if(byKey.couponGraves !== undefined){ const v = asJSON(byKey.couponGraves, null); if(Array.isArray(v)) couponGraves = [...new Set([...(couponGraves||[]), ...v.filter(x=>typeof x==="string").map(x=>x.trim().toUpperCase())])].slice(-500); }
  (cloud.coupons||[]).forEach(r => {
    if(!r || !r.code) return;
    const code = String(r.code).trim().toUpperCase();
    if(couponGraves.includes(code)) return;
    const row = { code, type:(r.type==="flat"||r.type==="ship")?r.type:"pct", value:Number(r.value)||0,
      minOrder:Number(r.min_order)||0, active:r.active!==false, uses:Number(r.uses)||0,
      maxUses:Number(r.max_uses)||0, expiry:r.expiry||"", start:r.start_date||"", note:String(r.note||"") };
    const i = coupons.findIndex(x=>x && String(x.code).toUpperCase()===code);
    if(i>=0) coupons[i] = Object.assign(coupons[i], row); else coupons.push(row);
  });
  coupons = coupons.filter(x=>x && x.code && !couponGraves.includes(String(x.code).toUpperCase()));
  store.set("nukto.couponGraves", couponGraves);
  saveAll();
  initCatalog(); renderHeader(); renderFooter(); render();
}
// Poori catalog server par (pehli baar zaroori + weekly CSV ke baad dobara).
// Admin overrides + real stock server par mehfooz rehte hain; uske baad Publish dabao.
async function seedCatalogToCloud(){
  const tok = adminSyncToken();
  if(!tok){ toast("Pehle sync token save karein (neeche) 🔑"); return {ok:false, why:"no-token"}; }
  if(!supabase.url){ toast("Supabase connect nahi ❌"); return {ok:false, why:"no-cloud"}; }
  if(!confirm("Poori catalog ("+allProducts().length.toLocaleString()+" products) server par bhejni hai? Pehli baar zaroori hai; weekly CSV ke baad dobara. 1-2 minute lag sakte hain.")) return {ok:false, why:"cancel"};
  const list = allProducts().map(p => ({id:p.id, name:p.name, cat:p.cat, cat_label:p.catLabel, emoji:p.emoji, price:p.price, stock:p.stock, img:p.img||"", description:(p.desc||"").slice(0,2000)}));
  let done = 0, skipped = 0;
  toast("Seeding 0/"+list.length+" ... ⏳");
  for(let i=0; i<list.length; i+=500){
    try{
      const r = await fetch(supaFn("storefront-sync"), {method:"POST", headers:{"Content-Type":"application/json","x-admin-token":tok}, body:JSON.stringify({action:"seed_products", v:1, rows:list.slice(i,i+500)})});
      let d = null; try{ d = await r.json(); }catch(e){}
      if(!r.ok || !d || !d.ok){ toast("Seed ruk gaya ("+done+"/"+list.length+"): "+((d&&d.error)||r.status)+" ❌"); return {ok:false, why:((d&&d.error)||r.status)}; }
      done += (d.upserted||0); skipped += (d.skipped||0);
      toast("Seeding "+Math.min(i+500,list.length)+"/"+list.length+" ... ⏳");
    }catch(e){ toast("Network issue — seed ruk gaya ❌ ("+done+"/"+list.length+")"); return {ok:false, why:"network"}; }
  }
  logAct("seeded catalog to cloud ("+done+" rows, "+skipped+" overrides kept)");
  toast("Catalog seeded ✅ ("+done+" rows, "+skipped+" admin overrides kept)");
  return {ok:true, done, skipped};
}

  ];
  _lastSaveOk = wrote.every(Boolean);

function _pruneMap(m, keep){
  if(!m || typeof m!=="object") return {};
  const e = Object.entries(m);
  if(e.length <= keep) return m;
  e.sort((a,b)=>b[1]-a[1]);
  const out={}; e.slice(0,keep).forEach(([k,v])=>{ out[k]=v; });
  return out;
}

/* ---------- one-time clean-up of demo/stale data ----------
   Older builds seeded fake wallet rows (e.g. "2026-08-20 deposit approved EP-88123 +Rs. 500",
   "2026-08-24 purchase approved ORD-2201") into localStorage.nukto.txns. Those rows had no
   owner, so every account — including brand-new ones — saw someone else's history.
   Rows with no linked account are dropped once; real rows always carry a userId. */
const DEMO_TXN_REFS = ["EP-88123","ORD-2201","DEMO-1","DEMO-2"];
function purgeStaleData(){
  if(store.get("nukto.purged1", false)) return;
  const known = new Set(users.map(u=>u.id));
  if(user && user.id) known.add(user.id);
  const before = txns.length;
  txns = txns.filter(t=>{
    if(DEMO_TXN_REFS.includes(String(t.ref||"").toUpperCase())) return false;
    if(!t.userId) return false;                 // no owner → demo/stale
    if(!known.has(t.userId)) return false;      // owner no longer exists
    return true;
  });
  const removed = before - txns.length;
  store.set("nukto.purged1", true);
  // demo orders/complaints/returns with no owner go too
  orders   = orders.filter(o=>!o.userId || known.has(o.userId));
  returns  = returns.filter(r=>!r.userId || known.has(r.userId));
  complaints = complaints.filter(c=>!c.userId || known.has(c.userId));
  if(removed){ store.set("nukto.txns", txns); console.info("Removed "+removed+" stale/demo transaction row(s)."); }
  store.set("nukto.orders", orders); store.set("nukto.returns", returns); store.set("nukto.complaints", complaints);
}
// Rebuild the signed-in user's wallet balance from approved transactions only.
// This stops a stale/edited localStorage "nukto.user" from showing a forged balance.
function reconcileWallet(){
  if(!user || !user.id) return;
  let bal=0;
  txns.forEach(t=>{
    if(t.userId!==user.id) return;
    if(t.status!=="approved") return;
    if(t.type==="deposit") bal+=t.amount;
    else if(t.type==="purchase") bal-=t.amount;
    else if(t.type==="refund") bal+=t.amount;
  });
  user.walletBalance=Math.max(0, round2(bal));
  const u=users.find(x=>x.id===user.id); if(u) u.walletBalance=user.walletBalance;
}

  const vv=i.v?(pr.vars||[]).find(x=>x.la===i.v):null;

/* ---------- SEARCH ENGINE ---------- */
// Everything is matched against a lowercase index that is built ONCE at boot.
// (Previously every keystroke re-lowercased name+desc for all 9,804 products, which is
//  what made the search box and the whole page stutter.)
function safeDecode(s){ try{ return decodeURIComponent(String(s||"")); }catch(e){ return String(s||""); } }

// "Tooth-Brushes!" -> "tooth brushes"   ·   "+92 300-1234567" -> "92 300 1234567"
function normText(s){ return String(s==null?"":s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim(); }
// light stemmer so brush/brushes/brushing and tooth/teeth all land together
function stem(w){
  if(w.length<=3) return w;
  const IRREG = {teeth:"tooth", feet:"foot", knives:"knife", men:"man", women:"woman",
                 children:"child", mice:"mouse", geese:"goose"};
  if(IRREG[w]) return IRREG[w];
  if(w.length>5 && /ies$/.test(w)) return w.slice(0,-3)+"y";            // batteries -> battery
  if(w.length>4 && /(ss|sh|ch|x)es$/.test(w)) return w.slice(0,-2);     // brushes -> brush, glasses -> glass
  if(w.length>4 && /s$/.test(w) && !/(ss|us|is)$/.test(w)) return w.slice(0,-1); // buds -> bud
  if(w.length>5 && /ing$/.test(w)) return w.slice(0,-3);
  if(w.length>5 && /ed$/.test(w)) return w.slice(0,-2);
  return w;
}
function tokenize(q){ return normText(q).split(" ").filter(Boolean); }
function stemmedToks(q){ return tokenize(q).map(stem).filter(Boolean); }

// per-product search documents, built once (Map: id -> {name, head, all})
const _SEARCH_INDEX = new Map();
function buildSearchIndex(){
  _SEARCH_INDEX.clear();
  try{ _SEARCH_CACHE.clear(); }catch(e){}
  allProducts().forEach(p=>{
    const name = normText(p.name);
    const head = name+" "+normText(p.catLabel)+" "+normText(p.emoji||"");
    const all  = head+" "+normText(p.desc)+" "+normText(p.id)+" "+normText(p.store); // id/store internal-only (UI me kabhi show nahi hote)
    _SEARCH_INDEX.set(p.id, {name, head, all});
  });
}
function _doc(p){ return _SEARCH_INDEX.get(p.id) || {name:normText(p.name), head:normText(p.name), all:normText(p.name)}; }

// Score one token against one product. 0 = no match.
// 6 whole word in the title · 5 title contains it · 4 word starts with it (so a typo in
// the last letter still hits) · 3 exact word in category/supplier/SKU · 2 anywhere ·
// 1 fuzzy one-edit-away in the title (catches "tothbrush", "brushs", "toothbrushs").
function _tokScore(t, d){
  const nameWords = d.name.split(" ");
  if(nameWords.includes(t)) return 6;
  if(d.name.includes(t)) return 5;
  for(let i=0;i<nameWords.length;i++){ if(nameWords[i].startsWith(t)) return 4; }
  const headWords = d.head.split(" ");
  if(headWords.includes(t)) return 3;
  if(d.all.includes(t)) return 2;
  if(t.length>=5){ for(let i=0;i<nameWords.length;i++){ if(_oneEdit(t, nameWords[i])) return 1; } }
  return 0;
}
// true when a and b differ by at most one insert/delete/replace (same-ish length only)
function _oneEdit(a,b){
  const la=a.length, lb=b.length;
  if(Math.abs(la-lb)>1) return false;
  if(la===lb){ let diff=0; for(let i=0;i<la;i++){ if(a[i]!==b[i]){ if(++diff>1) return false; } } return diff===1; }
  let s = la<lb ? a : b, l = la<lb ? b : a, i=0, j=0, diff=0;
  while(i<s.length && j<l.length){
    if(s[i]===l[j]){ i++; j++; }
    else { if(++diff>1) return false; j++; }
  }
  return true;
}
// total relevance of a product for a stemmed query; returns 0 when ANY token misses
// (AND semantics, so "tooth brush" never returns an unrelated "brush")
function scoreProduct(p, stoks){
  const d=_doc(p); let total=0;
  for(let i=0;i<stoks.length;i++){
    const s=_tokScore(stoks[i], d);
    if(!s) return 0;
    total+=s;
  }
  if(stoks.length>1 && d.name.includes(stoks.join(""))) total+=4; // "toothbrush" written together
  return total;
}
// exact matches, best first (memoised per query — a search is scored once, not per render)
const _SEARCH_CACHE = new Map();
function searchProducts(q, limit){
  const key = normText(q);
  if(!key) return [];
  let hits = _SEARCH_CACHE.get(key);
  if(!hits){
    const stoks = key.split(" ").map(stem).filter(Boolean);
    hits = [];
    if(stoks.length){
      const pool=allProducts();
      for(let i=0;i<pool.length;i++){
        const p=pool[i], s=scoreProduct(p, stoks);
        if(s) hits.push({p, s});
      }
      hits.sort((a,b)=> b.s-a.s || a.p.name.localeCompare(b.p.name));
    }
    if(_SEARCH_CACHE.size>80) _SEARCH_CACHE.clear();
    _SEARCH_CACHE.set(key, hits);
  }
  const out = hits.map(x=>x.p);
  return limit ? out.slice(0,limit) : out;
}
// "and us se related" — same category / same keyword, but NOT already an exact match
function relatedToSearch(q, excludeList, limit){
  limit = limit||24;
  const stoks = stemmedToks(q);
  if(!stoks.length) return [];
  const skip = new Set((excludeList||[]).map(p=>p.id));
  // categories the exact hits live in
  const cats = {};
  (excludeList||[]).slice(0,25).forEach(p=>{ cats[p.cat]=(cats[p.cat]||0)+1; });
  // plus categories whose own name matches a query token
  CATEGORIES.forEach(c=>{
    const nm=normText(c.name), sid=normText(c.id);
    stoks.forEach(t=>{ if(nm.includes(t) || sid.includes(t) || (CATEGORY_TERMS[c.id]||"").split(" ").some(w=>w===t)) cats[c.id]=(cats[c.id]||0)+1; });
  });
  const catIds = Object.keys(cats);
  if(!catIds.length) return [];
  const pool=[];
  const visible=allProducts();
  for(let i=0;i<visible.length;i++){
    const p=visible[i];
    if(skip.has(p.id) || !cats[p.cat]) continue;
    // a product is "related" when it shares at least one stem with the query
    let shared=0;
    const words=_doc(p).name.split(" ");
    for(let k=0;k<words.length;k++){ const w=stem(words[k]); if(stoks.includes(w)) shared++; }
    pool.push({p, s:(shared*3)+cats[p.cat]});
  }
  pool.sort((a,b)=> b.s-a.s || a.p.name.localeCompare(b.p.name));
  return pool.slice(0,limit).map(x=>x.p);
}
// backwards-compatible helper used by the old call sites
function matchTokens(p, toks){
  const stoks = (toks||[]).map(stem);
  return stoks.length ? scoreProduct(p, stoks) > 0 : true;
}

  "mirror":"vanity mirror makeup", "wall":"wall art frame decor",
};
// slug -> related keywords, so a category-based related search shows useful results
const CATEGORY_TERMS = {
  "gadgets":"gadget tech electronic bluetooth charger", "fashion":"fashion clothing dress shoes wear",
  "beauty":"beauty makeup skincare cosmetics", "home":"home living decor kitchen decoration",
  "automotive":"car motorbike bike auto", "books":"book stationery pen notebook",
  "tools":"tool diy hardware", "gifts":"gift present hamper", "travel":"travel bag luggage outdoors",
  "kids":"kids toy baby children", "pets":"pet animal dog cat", "islamic":"islamic prayer tasbeeh",
  "groceries":"grocery food snack", "other":"miscellaneous",
};
function searchCategoryTerms(tok){
  const out=[];
  CATEGORIES.forEach(c=>{
    const h=(c.name+" "+c.id).toLowerCase();
    const hits = h.includes(tok) || tok.includes(c.id);
    const kw = (CATEGORY_TERMS[c.id]||"").split(/\s+/).some(w=> w===tok || (tok.length>=3 && w.startsWith(tok)) || (w.length>=3 && tok.startsWith(w)));
    if(hits || kw){ if(!out.includes(c.id)) out.push(c.id); }
  });
  return out;
}
function relatedSearchTerms(q){
  const toks=tokenize(q)||[];
  const out=[];
  toks.forEach(t=>{
    (SEARCH_SYN[t]||"").split(/\s+/).forEach(w=>{ if(w && !out.includes(w)) out.push(w); });
    searchCategoryTerms(t).forEach(cid=>{ const nm=CATEGORIES.find(x=>x.id===cid); const label=nm?nm.name:cid; if(!out.includes(label)) out.push(label); });
  });
  // if nothing derived, add the raw query as a fallback so there's always a chip
  if(!out.length && toks.length){ out.push(q.trim()); }
  return out.slice(0,8);
}
let _suggT=null;
function searchSugg(q){
  // debounced: suggestions used to rescan + re-lowercase all 9,804 products per keystroke
  clearTimeout(_suggT);
  _suggT=setTimeout(()=>_searchSuggNow(q), 120);
}
function _searchSuggNow(q){
  const box=$id("sugg"); if(!box) return;
  const nt=normText(q);
  if(!nt){ box.style.display="none"; return; }
  if(!window._suggIdx){ const seen=new Set(); window._suggIdx=[];
    allProducts().forEach(p=>{ const t=normText(p.name); if(t && !seen.has(t)){ seen.add(t); window._suggIdx.push(t); } });
    window._suggIdx.sort(); }
  const pref=window._suggIdx.filter(t=>t.indexOf(nt)===0).slice(0,8);
  const qesc=esc(q).replace(/'/g,"\\'");
  let html=`<div style="padding:8px 14px 4px;font-size:11px;letter-spacing:.4px;color:var(--muted);font-weight:700">SUGGESTIONS</div>`;
  html+=pref.map(t=>`<div onclick="location.hash='search:'+encodeURIComponent('${t.replace(/'/g,"\\'")}')">${esc(t)}</div>`).join("");
  const n=searchProducts(q).length;
  html+=`<div onclick="location.hash='search:'+encodeURIComponent('${qesc}')" style="font-weight:700;color:var(--primary)">Search products for \u201c${esc(q)}\u201d${n?" \u2014 "+n.toLocaleString()+" results":""} \u2192</div>`;
  box.innerHTML=html;
  box.style.display="block";
}

/* ---------- media (image OR video) with play-button thumbnail ---------- */
function isVideoUrl(u){ return /\.(mp4|webm|ogv|m4v|mov)(\?.*)?$/i.test(u||""); }
// svg play icon (matches palette)
const PLAY_ICON = '<svg viewBox="0 0 24 24" width="22" height="22" fill="#fff" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
function mediaHTML(p, opts){
  opts = opts||{};
  const src = String(p.img||"").trim();
  const cls = opts.cls||"pimage";
  const emoji = p.emoji||"📦";
  const lazy = opts.lazy===false ? "" : " loading=\"lazy\"";
  const st = opts.style ? ' style="'+opts.style+'"' : "";
  // No emoji — use a neutral skeleton shimmer while media loads / if it fails.
  const sk = `<div class="media-sk"><div class="sk"></div></div>`;
  // NOTE: this string goes inside a double-quoted HTML attribute -> every " must be
  // encoded as &quot; otherwise the attribute closes early and markup leaks as text.
  const fallback = ("this.outerHTML='" + sk.replace(/'/g,"\\'") + "'").replace(/"/g,"&quot;");
  if(!src) return `<span class="media-sk"><div class="sk"></div></span>`;
  // DETAIL / inline mode (product page): plays inline with controls
  if(opts.mode==="detail" && isVideoUrl(src)){
    return `<div class="vid-detail">`+
      `<video class="${cls}" src="${esc(src)}"${st} controls autoplay muted loop playsinline preload="metadata" onloadedmetadata="if(this.duration>0){try{this.currentTime=Math.min(1.2,this.duration*0.2)}catch(e){}}"${lazy} onerror="${fallback}">${emoji}</video>`+
      `</div>`;
  }
  // THUMBNAIL mode (cards / grid): muted preview + functional play button that opens product
  if(isVideoUrl(src)){
    return `<div class="vid-thumb">`+
      `<video class="${cls}" src="${esc(src)}"${st} muted loop playsinline preload="metadata" onloadedmetadata="if(this.duration>0){try{this.currentTime=Math.min(1.2,this.duration*0.3)}catch(e){}}"${lazy} onerror="${fallback}">${emoji}</video>`+
      `<button class="vplay" onclick="event.stopPropagation();var v=this.parentElement.querySelector('video');if(v){v.controls=true;v.muted=false;v.play().catch(function(){});this.style.display='none';}" aria-label="Play video">${PLAY_ICON}</button>`+
      `<span class="vbadge bottom-left">▶ Video</span>`+
      `</div>`;
  }
  return `<img class="${cls}" src="${esc(src)}" alt="${esc(p.name)}"${st}${lazy} decoding="async" onerror="${fallback}">`;
}

  const fav = wishlist.includes(p.id);
  const tags = [];

  if(p.na===1) tags.push('<span class="tag" style="background:#64748b">Not Available</span>');

  else if(SPECIAL_RE.test(p.name)) tags.push('<span class="tag" style="background:linear-gradient(90deg,#a855f7,#ec4899)">🎁 Special</span>');
  return `<div class="pcard">
    <div class="pimg">${mediaHTML(p, {mode: isVideoUrl(p.img)?"thumb":"img"})}
      ${d?`<span class="off">-${d}%</span>`:""}
      ${tags.slice(0,1).join("")}

      <div class="pprice" style="color:var(--primary)">${fmt(sale)} ${sale<p.price?`<span class="old">${fmt(p.price)}</span>`:orig>sale?`<span class="old">${fmt(orig)}</span>`:""}</div>

function submitReview(pid){

function addCart(id,qty,v){
  qty=qty||1; v=v||""; const p=prod(id);
  if(!p) return;
  if(p.stock===0){ toast("This item is out of stock ❌"); return; }
  const vv=(p.vars||[]).find(x=>x.la===v);
  const unitPrice= (vv && vv.pr>0) ? vv.pr : p.price;
  let line=cart.find(i=>i.id===id && i.v===v);
  const nq=Math.min((line?line.qty:0)+qty, p.stock);
  if(line) line.qty=nq; else cart.push({id, qty:nq, v, price:unitPrice});
  analytics.addCarts=(analytics.addCarts||0)+1; analytics.addToCart[id]=(analytics.addToCart[id]||0)+1; _saveAnalytics();
  saveAll(); renderHeader(); toast("✅ added to cart — "+esc(p.name).slice(0,40)); cartPopup();
}

function removeItem(id,v){ try{v=decodeURIComponent(v||"");}catch(e){v=v||"";} cart=cart.filter(i=>!(i.id===id && i.v===v)); saveAll(); render(); toast("Removed from cart"); }

function setCheckoutVariant(id,from,to){
  const p=prod(id); if(!p||!to) return;
  try{from=decodeURIComponent(from||"");}catch(e){from=from||"";}
  const item=cart.find(i=>i.id===id && (i.v||"")===String(from||"")); if(!item) return;
  const other=cart.find(i=>i!==item && i.id===id && (i.v||"")===to);
  if(other){ other.qty=Math.min(p.stock,other.qty+item.qty); cart=cart.filter(x=>x!==item); }
  else { item.v=to; item.price=salePrice(p,(p.vars.find(v=>(v.la||v.label)===to)||{}).pr||p.price); }
  saveAll(); render();
}

function pmPick(el){ document.querySelectorAll('.radio').forEach(r=>r.classList.remove('on')); el.classList.add('on'); }
function applyCoupon(code){
  code=String(code||"").trim().toUpperCase();
  const c=coupons.find(x=>x.code.toUpperCase()===code);
  if(!c){ toast("Invalid coupon code ❌"); return; }
  if(!c.active){ toast("This coupon is no longer active"); return; }
  if(c.start && new Date(c.start)>new Date()){ toast("⏳ Ye coupon abhi active nahi (start "+c.start+")"); return; }
  if(c.expiry && new Date(c.expiry)<new Date()){ toast("This coupon has expired"); return; }
  if(c.maxUses && (c.uses||0)>=c.maxUses){ toast("Coupon usage limit reached"); return; }
  if(c.minOrder && cartSubtotal()<c.minOrder){ toast("Minimum order of Rs. "+c.minOrder.toLocaleString()+" required"); return; }
  const _cu=store.get("nukto.couponUse",{}), _ck=(user?user.email||user.username:"guest")+":"+c.code;
  if((_cu[_ck]||0)>=1){ toast("You have already used coupon "+c.code); return; }
  _cu[_ck]=(_cu[_ck]||0)+1; store.set("nukto.couponUse",_cu);
  promo={code:c.code, type:c.type, value:c.value, minOrder:c.minOrder};
  saveAll(); render();
  const msg = c.type==="pct"?("— "+c.value+"% off"):c.type==="flat"?("— Rs. "+c.value+" off"):"— free delivery";
  toast("🎟️ "+c.code+" applied "+msg);
}
function removeCoupon(){ promo=null; saveAll(); render(); toast("Coupon removed"); }
let pendingOrder={};
// Order kabhi block nahi hoga — customer jitni bhi info likhe, lagta hai.
// Aap (admin) confirmation mail + call par naam/number/address verify karte hain.
async function placeOrder(){
  const bad=cartStockIssues();
  if(bad.length){ toast("Cart update chahiye \u2014 kuch items out of stock hain"); render(); return; }
  if(!checkoutVariantsValid()){ toast("Pehle size / colour / option confirm karein"); return; }
  const pm=document.querySelector('input[name="pm"]:checked').value;
  const taxTotal=checkoutTaxTotal();
  const sub=cartSubtotal(), disc=cartDisc(), del=deliveryFee(), total=round2(sub-disc+del+taxTotal);
  if(pm==="wallet" && user.walletBalance<total){ toast("Insufficient wallet balance ❌"); return; }
  // server-side: stock lock + real prices + coupon/wallet validation (agar backend configured hai)
  const sv=await secureOrder(pm);
  if(sv===false) return;                 // server ne reject kiya — order block
  if(sv) pendingSecure=sv;               // authoritative id/total finalizeOrder use karega
  if(pm==="wallet"){ finalizeOrder("wallet", sv?sv.total:total, true, sv?sv.id:undefined); }
  else { paymentModal(pm, sv?sv.total:total); }

/* ---------- phone numbers ----------
   Accepts 03XXXXXXXXX / +92 3XX XXXXXXX / 923XXXXXXXXX / 0092 3XX… and stores ONE format:
   03XXXXXXXXX. Anything else (landline, short number, 9 digits, letters) is rejected with
   a clear message instead of being saved and blowing up later at checkout/courier. */
function normalizePhone(v){
  let d = String(v==null?"":v).replace(/[^\d+]/g,"");
  if(d.startsWith("00")) d = d.slice(2);
  if(d.startsWith("+")) d = d.slice(1);
  if(d.startsWith("92") && d.length===12) d = "0"+d.slice(2);
  return d;
}
function isValidPhone(v){ return /^03\d{9}$/.test(normalizePhone(v)); }
function prettyPhone(v){ const d=normalizePhone(v); return /^03\d{9}$/.test(d) ? d.slice(0,4)+" "+d.slice(4) : String(v==null?"":v); }
function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v||"").trim()); }
function uniqueUsername(email, fullName){
  let base = String(email||"").split("@")[0].toLowerCase().replace(/[^a-z0-9._]/g,"") ||
             String(fullName||"user").toLowerCase().replace(/[^a-z0-9]/g,"") || "user";
  if(base.length<3) base = base+"user";
  let u = base, n = 1;
  while(users.some(x=> x.username && x.username.toLowerCase()===u.toLowerCase())){ n++; u = base+n; }
  return u;
}
function hashPw(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h)+s.charCodeAt(i); h|=0; } return "h"+(h>>>0).toString(36)+"_"+s.length; }
/* --- secure admin credential (SHA-256 hash — password kabhi source mein nahi) --- */
const ADMIN_USER = "admin1";
const ADMIN_HASH = "a7256ce94c29bbc6af8ca36cfb3486763b1c1d6855835a74de1b46481dc45ca2"; // SHA-256 of admin password (owner only)
// pure-JS SHA-256 (known-correct impl, works offline + file:// too)
function sha256(ascii) {
  function rightRotate(v,a){return (v>>>a)|(v<<(32-a));}
  var mathPow=Math.pow, maxWord=mathPow(2,32), lengthProperty='length';
  var i,j,result='',words=[],asciiBitLength=ascii[lengthProperty]*8;
  var hash=sha256.h=sha256.h||[], k=sha256.k=sha256.k||[];
  var primeCounter=k[lengthProperty], isComposite={};
  for(var candidate=2; primeCounter<64; candidate++){
    if(!isComposite[candidate]){
      for(i=0;i<313;i+=candidate) isComposite[i]=candidate;
      hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+='\x80';
  while(ascii[lengthProperty]%64-56) ascii+='\x00';
  for(i=0;i<ascii[lengthProperty];i++){
    j=ascii.charCodeAt(i);
    if(j>>8) return 'f'; // non-ASCII not expected for our password
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words[lengthProperty]]=((asciiBitLength/maxWord)|0);
  words[words[lengthProperty]]=(asciiBitLength);
  for(j=0;j<words[lengthProperty];){
    var w=words.slice(j,j+=16), oldHash=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      var temp1=hash[7]+(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))+w[i-7]+(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10)))|0);
      var temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+oldHash[i])|0;
  }
  for(i=0;i<8;i++) for(j=3;j+1;j--){
    var b=(hash[i]>>(j*8))&255;
    result+=((b<16)?0:'')+b.toString(16);
  }
  return result;
}

function submitReturn(oid){ const reason=$id("ret_reason").value.trim(); if(!reason){toast("Enter a reason");return;} const o=orders.find(x=>x.id===oid); if(!o){toast("Order not found");return;} if(returns.some(r=>r.orderId===oid && r.status==="pending")){toast("A return request for this order is already pending");closeModal();return;} returns.unshift({id:"RTN-"+Date.now().toString(36).toUpperCase().slice(-5),orderId:oid,userId:user.id,userName:user.fullName,userEmail:user.email||"",amount:o.total,reason,status:"pending",date:new Date().toISOString().slice(0,10)}); saveAll(); pushCloud(false); closeModal(); render(); toast("Return request submitted ↩️"); }
// Refund goes to the CUSTOMER who owns the return — never to whoever is signed in.
// (It used to do `if(pu && r.userId===pu.id) pu.walletBalance += …`, i.e. only credited the
//  admin's own wallet when the admin happened to be the customer, so customers never got paid.)
function approveReturn(id){
  const r=returns.find(x=>x.id===id); if(!r) return;
  if(r.status==="approved"){ toast("Already approved"); return; }
  r.status="approved"; r.approvedOn=new Date().toISOString().slice(0,10);
  const owner=users.find(x=>x.id===r.userId);
  txns.unshift({id:"T-"+Date.now().toString(36).toUpperCase().slice(-6), type:"refund", amount:r.amount,
    method:"wallet", status:"approved", date:new Date().toISOString().slice(0,10), ref:r.orderId,
    userId:r.userId, userName:r.userName||(owner?owner.fullName:""), userEmail:r.userEmail||(owner?owner.email:"")});
  reconcileUserBalance(r.userId);
  saveAll(); pushCloud(false); render();
  toast("Refund of "+fmt2(r.amount)+" credited to "+(r.userName||"customer")+" ↩️");
}
// Recompute one user's wallet from their approved transactions and write it back to the record.
function reconcileUserBalance(uid){
  if(!uid) return;
  let bal=0;
  txns.forEach(t=>{
    if(t.userId!==uid || t.status!=="approved") return;
    if(t.type==="deposit") bal+=t.amount;
    else if(t.type==="purchase") bal-=t.amount;
    else if(t.type==="refund") bal+=t.amount;
  });
  bal=Math.max(0, round2(bal));
  const rec=users.find(x=>x.id===uid); if(rec) rec.walletBalance=bal;
  if(user && user.id===uid) user.walletBalance=bal;
  return bal;
}

/* ---------- wallet top-up (deposit) ----------
   The screenshot input used to have no handler at all, so the payment proof was thrown
   away. It is now downscaled, stored per-transaction, and shown to the admin. */
let PROOFS = store.get("nukto.proofs", {});       // txn id -> data URL (kept out of the txn record)
let _proofDraft = null;                            // data URL picked in the modal, not yet submitted
function _saveProofs(){
  // keep only the newest 25 proofs so screenshots can never eat the storage quota
  const keys = Object.keys(PROOFS);
  if(keys.length > 25){ keys.slice(0, keys.length-25).forEach(k=>{ delete PROOFS[k]; }); }
  store.set("nukto.proofs", PROOFS);
}
function viewProof(tid){
  const src = PROOFS[tid];
  if(!src){ openModal(`<h3>Payment proof</h3><p class="muted">Is request ke saath screenshot upload nahi hua (ya doosre device se submit hui thi). Customer ka <b>Transaction ID</b> apne EasyPaisa/JazzCash statement se match karein.</p><button class="btn btn-outline" style="width:100%;justify-content:center" onclick="closeModal()">Close</button>`); return; }
  openModal(`<h3>Payment proof</h3><img src="${src}" alt="payment screenshot" style="width:100%;border-radius:12px;border:1px solid var(--line)"><button class="btn btn-outline" style="width:100%;justify-content:center;margin-top:10px" onclick="closeModal()">Close</button>`);
}
// downscale to <=1000px @ 0.7 jpeg so a proof costs ~80–150 KB, not 3 MB
function _readProof(file){
  return new Promise((resolve,reject)=>{
    if(!file) return resolve(null);
    if(!/^image\//.test(file.type)) return reject(new Error("Sirf image file (JPG/PNG) upload karein"));
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error("File read nahi ho saki"));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("Image open nahi ho saki"));
      img.onload=()=>{
        const max=1000, sc=Math.min(1, max/Math.max(img.width,img.height));
        const cv=document.createElement("canvas");
        cv.width=Math.max(1,Math.round(img.width*sc)); cv.height=Math.max(1,Math.round(img.height*sc));
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        const url=cv.toDataURL("image/jpeg",0.7);
        if(url.length>900000) return reject(new Error("Screenshot bohat bari hai — chhoti image bhejein"));
        resolve(url);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function pickProof(input){
  const f=input.files&&input.files[0];
  _proofDraft=null;
  const hint=$id("dep_proof_hint");
  if(!f){ if(hint) hint.textContent=""; return; }
  if(hint) hint.textContent="Reading…";
  _readProof(f).then(url=>{ _proofDraft=url; if(hint) hint.textContent="✅ "+f.name+" ready"; })
               .catch(e=>{ if(hint) hint.textContent="⚠️ "+e.message; });
}

function submitDeposit(){
  if(!user){ toast("Pehle login karein"); return; }
  const amt=Math.round(Number($id("dep_amt").value)||0);
  const ref=$id("dep_ref").value.trim();
  const nm=$id("dep_name").value.trim();

  const pmEl=document.querySelector('input[name="dpm"]:checked');
  const pm=pmEl?pmEl.value:"easypaisa";

  txns.unshift({id, type:"deposit", amount:amt, method:pm, status:"pending",

    userId:user.id, userName:nm, userEmail:user.email||"", userPhone:phone,

function tryLogin(u,p){ const h=sha256(p);
  if(u===ADMIN_USER && h===ADMIN_HASH) return {name:u, role:"owner"};
  const m=team.find(x=>x.name.toLowerCase()===u.toLowerCase());
  if(m && m.pass===h) return {name:m.name, role:m.role};
  return null; }
function adminLogin(){ const u=$id("a_user").value.trim(),p=$id("a_pass").value; if(!u||!p){toast("Enter username and password");return;}
  const ses=tryLogin(u,p); if(!ses){ toast("Invalid credentials ❌"); return; }

  const varsRaw=($id("ep_vars")&&$id("ep_vars").value||"").trim();
  const vars=varsRaw?varsRaw.split("\n").map(line=>{const a=line.split("|");return {la:(a[0]||"").trim(),pr:Number(a[1])||0};}).filter(v=>v.la):null;
  const data={name:$id("ep_name").value.trim(),cost:Number($id("ep_cost").value)||0,price:Number($id("ep_price").value)||0,stock:Number($id("ep_stock").value)||0,emoji:$id("ep_emoji").value||"📦",catLabel:$id("ep_cat").value.trim(),img:$id("ep_img").value.trim(),desc:$id("ep_desc").value.trim(),gal:gal};
  if(vars) data.vars=vars;
  if(!id){
    const newId="new-"+Date.now();
    const np=Object.assign({id:newId,cat:"gadgets",catLabel:data.catLabel||"Gadgets",g:0,c:0,t:0,m:0,store:"Manual"},data);
    PRODUCTS.unshift(np);
    if(!customProducts.some(x=>x.id===newId)) customProducts.push(np);
    store.set("nukto.customProducts",customProducts);
    markStorefrontDirty();
  } else {
    const p=prod(id); const _stockChanged=p&&Number(p.stock)!==Number(data.stock); Object.assign(p,data);
    prodEdit[id]=Object.assign(prodEdit[id]||{},data);
    markStorefrontDirty(_stockChanged?id:null);

function impFile(inp){ const f=inp.files&&inp.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ const t=$id("imp_txt"); if(!t)return;
    if(/\.csv$/i.test(f.name||"")){ const arr=wooCSVToProducts(String(r.result)); t.value=JSON.stringify({products:arr}); toast("📄 CSV parsed: "+arr.length+" products ready to upload"); }
    else t.value=String(r.result); };
  r.readAsText(f); }
function parseCSVRows(text){ const rows=[]; let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else if(c!=="\r") cur+=c; }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows; }
function wooCSVToProducts(text){
  const rows=parseCSVRows(text); if(rows.length<2) return [];
  const head=rows[0].map(h=>h.trim()); const ix=n=>head.indexOf(n);
  const get=(r,n)=>{ const i=ix(n); return i<0?"":(r[i]||""); };
  const parents=[],varis=[];
  rows.slice(1).forEach(r=>{
    if(r.length<2) return;
    const type=get(r,"Type").trim();
    if(type==="variation"){ varis.push(r); return; }
    const sku=get(r,"SKU").trim(); if(!sku) return;
    const imgs=get(r,"Images").split(",").map(x=>x.trim()).filter(Boolean);
    const top=(get(r,"Categories")||"").split(",")[0].split(">")[0].trim()||"Other";
    let name=get(r,"Name").trim();
    if(!name){ const m=(get(r,"Description")||"").match(/Product Title\s*\n+([^\n]+)/); name=m?m[1].trim():"(Untitled "+sku+")"; }
    const cost=Number(get(r,"Regular price"))||0;
    parents.push({id:sku,name:name,catLabel:top,cost:cost,price:cost,
      stock:get(r,"In stock?").trim()==="1"?60:0,img:imgs[0]||"",gal:imgs.slice(1),
      desc:get(r,"Description").trim(),store:get(r,"Store").trim(),vars:[]});
  });
  const bySku={}; parents.forEach(pp=>bySku[pp.id]=pp);
  varis.forEach(v=>{
    const num=(get(v,"Parent ID")||"").trim().replace(/\.0+$/,"");
    let parent=bySku["hhc-"+num]||bySku[num];
    if(!parent){ const m=(get(v,"SKU")||"").match(/^(hhc-\d+)-/); parent=m?bySku[m[1]]:null; }
    if(parent) parent.vars.push({la:(get(v,"Variation Attributes")||"").trim()||"Variant",pr:Number(get(v,"Regular price"))||0});
  });
  parents.forEach(pp=>{ if(!pp.price&&pp.vars.length) pp.price=Math.min.apply(null,pp.vars.map(x=>x.pr)); });
  return parents;
}
function adminImportProducts(arr){
  if(!needEdit()) return {ok:false,added:0,why:"read-only role"};
  if(typeof arr==="string"){ try{ arr=JSON.parse(arr); }catch(e){ return {ok:false,added:0,why:"invalid JSON"}; } }
  if(arr && !Array.isArray(arr) && Array.isArray(arr.products)) arr=arr.products;
  if(!Array.isArray(arr)) return {ok:false,added:0,why:"expected products array"};
  let added=0;
  for(const raw of arr){
    if(!raw || typeof raw!=="object") continue;
    const id=raw.id||("new-"+Date.now()+"-"+added);
    if(prod(id)) continue;
    const np=Object.assign({cat:"other",catLabel:"Other",emoji:"📦",cost:0,price:0,stock:60,gal:[],vars:[],tags:[],g:0,c:0,t:0,m:0,store:"Import",new:1,desc:"",img:""},raw,{id:id});
    PRODUCTS.unshift(np); customProducts.push(np); added++;
  }
  if(added) markStorefrontDirty(); store.set("nukto.customProducts",customProducts); if(added) logAct("uploaded "+added+" products via bulk import"); CATEGORIES=buildCategories(); saveAll(); render();
  return {ok:true,added:added};
}

function bulkStock0(){ if(!needEdit())return; if(!adminSel.size){ toast("Pehle products select karo"); return; } adminSel.forEach(id=>{ const p=prod(id); if(p){ if(Number(p.stock)!==0){ p.stock=0; markStorefrontDirty(id); } prodEdit[id]=prodEdit[id]||{}; prodEdit[id].stock=0; } }); saveAll(); render(); toast("Set out of stock ✅"); }

function openCategoryModal(slug){
  const c = slug ? getCat(slug) : null;
  const o = slug ? (catOverrides[slug]||{}) : {};
  const custom = slug ? (customCategories.find(x=>x.slug===slug)||null) : null;
  openModal(`<h3>${c?"✏️ Edit Category":"➕ Add Category"}</h3>
    <input type="hidden" id="c_slug" value="${esc(slug||"")}">
    <div class="field"><label class="label">Category Name *</label><input class="input" id="c_name" value="${esc(c?(o.name||c.name):"")}" placeholder="e.g. Electronics"></div>
    <div class="field"><label class="label">Slug (optional, URL id; leave blank to auto-generate)</label><input class="input" id="c_sluginput" value="${esc(slug||"")}" placeholder="electronics" ${c?"readonly":""}></div>
    <div class="field"><label class="label">Emoji / Icon</label><input class="input" id="c_emoji" value="${esc(c?(o.emoji||c.emoji||"📦"):"📦")}" placeholder="📦"></div>
    <div class="form-row"><button class="btn btn-emerald" onclick="saveCategory()">💾 Save</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button></div>
  `);
}
function saveCategory(){
  if(!needEdit())return;
  const slug=$id("c_slug").value;
  const name=$id("c_name").value.trim();
  const emoji=$id("c_emoji").value.trim()||"📦";
  if(!name){ toast("Enter a category name"); return; }
  if(slug){
    // edit existing — persist rename everywhere
    const custom = customCategories.find(x=>x.slug===slug);
    catOverrides[slug] = Object.assign(catOverrides[slug]||{}, {name, emoji});
    if(custom){ custom.name=name; custom.emoji=emoji; }
    allProducts().forEach(p=>{ if(p.cat===slug) p.catLabel=name; });
    store.set("nukto.catOverrides",catOverrides);
    CATEGORIES=buildCategories();
    markStorefrontDirty(); saveAll(); closeModal(); render(); toast("Category updated ✅");
  } else {
    let nslug=$id("c_sluginput").value.trim().toLowerCase().replace(/[^a-z0-9-_]+/g,"-").replace(/^-|-$/g,"") || name.toLowerCase().replace(/[^a-z0-9-_]+/g,"-").replace(/^-|-$/g,"");
    if(!nslug) nslug="cat-"+Date.now();
    if(CATEGORIES.some(c=>c.slug===nslug)){ toast("Slug already exists — use a different name"); return; }
    customCategories.push({slug:nslug, name, emoji});
    catOverrides[nslug]=Object.assign(catOverrides[nslug]||{},{name, emoji});
    store.set("nukto.customCategories",customCategories);
    store.set("nukto.catOverrides",catOverrides);
    CATEGORIES=buildCategories();
    markStorefrontDirty(); saveAll(); closeModal(); render(); toast("Category added ✅");
  }
}
function delCategory(slug){
  const c=getCat(slug); if(!c) return;
  if(!confirm("Hide category ‘"+c.name+"’? (products nahi delete honge)")) return;
  if(!hiddenCategories.includes(slug)) hiddenCategories.push(slug);
  store.set("nukto.hiddenCategories",hiddenCategories);
  CATEGORIES=buildCategories();
  markStorefrontDirty(); saveAll(); render(); toast("Category hidden");
}

function togglePriceGuard(on){ if(!needEdit())return; priceGuard=!!on; persistRatios();
  let n=0; allProducts().forEach(p=>{ if(p.cost>0){ const np=priceFromRatio(p.cost,curProdRatio(p)); if(np!==p.price){p.price=np; prodEdit[p.id]=Object.assign(prodEdit[p.id]||{},{price:np}); n++;} } });
  markStorefrontDirty(); saveAll(); render(); toast("Loss-guard "+(on?"ON":"OFF")+" — "+n+" products repriced"); }
function setProdRatio(id,val){ if(!needEdit())return; const p=prod(id); if(!p||!p.cost){toast("No cost on this product");return;}
  const r=Math.max(0,Number(val)||0); prodRatios[id]=r; p.price=priceFromRatio(p.cost,r);
  prodEdit[id]=Object.assign(prodEdit[id]||{},{price:p.price}); persistRatios(); logAct("product ratio → "+r.toFixed(2)+"× ("+p.id+")"); markStorefrontDirty(); saveAll(); render(); toast(p.name.slice(0,32)+" → "+fmt(p.price)); }
function resetProdRatio(id){ if(!needEdit())return; delete prodRatios[id]; const p=prod(id);
  if(p&&p.cost){ p.price=priceFromRatio(p.cost,curCatRatio(p.catLabel)); prodEdit[id]=Object.assign(prodEdit[id]||{},{price:p.price}); }
  persistRatios(); markStorefrontDirty(); saveAll(); render(); toast("Ratio reset to category default"); }
function setCatRatio(label,val){ if(!needEdit())return; const r=Math.max(0,Number(val)||0); catRatios[label]=r; persistRatios();
  let n=0; allProducts().forEach(p=>{ if(p.catLabel===label&&p.cost>0&&!(p.id in prodRatios)){ p.price=priceFromRatio(p.cost,r); prodEdit[p.id]=Object.assign(prodEdit[p.id]||{},{price:p.price}); n++; } });
  logAct("category ratio '"+label+"' → "+r.toFixed(2)+"× ("+n+" products)"); markStorefrontDirty(); saveAll(); render(); toast("Category '"+label+"' ratio "+r.toFixed(2)+"× — "+n+" products repriced ✅"); }
function applyBulkDisc(){ if(!needEdit())return; allProducts().forEach(p=>{ productDiscounts[p.id]=10; }); markStorefrontDirty(); saveAll(); render(); toast("Editable 10% discount applied to all products"); }

function addTeamMember(name,pass,roleKey,pin){ if(!ROLES[roleKey]) return {ok:false,why:"bad role"};
  name=(name||"").trim(); if(!name) return {ok:false,why:"name required"};
  if((pass||"").length<4) return {ok:false,why:"password min 4 chars"};
  if(name.toLowerCase()===ADMIN_USER || team.some(m=>m.name.toLowerCase()===name.toLowerCase())) return {ok:false,why:"name already taken"};
  team.push({id:"tm-"+Date.now(),name:name,pass:sha256(pass),role:roleKey,pin:(pin||"")?sha256(pin):"",created:new Date().toISOString()});
  store.set("nukto.team",team); return {ok:true}; }
function saveTeamMember(){ if(!needTeam())return; const r=addTeamMember($id("tm_name").value,$id("tm_pass").value,$id("tm_role").value,$id("tm_pin").value);
  if(!r.ok){ toast(r.why); return; } closeModal(); saveAll(); render(); toast("Member added ✅ — ab woh login kar sakta hai"); }
function setTeamRole(id,roleKey){ if(!needTeam())return; const m=team.find(x=>x.id===id); if(m){ m.role=roleKey; store.set("nukto.team",team); render(); toast(m.name+" → "+ROLES[roleKey].label); } }

function setOwnerPin(){ if(!needTeam())return; const np=prompt("Owner 2FA PIN (khali chhorein to remove):",""); if(np===null)return; store.set("nukto.ownerPin",np?sha256(np):""); logAct((np?"set":"removed")+" owner 2FA"); toast(np?"Owner 2FA set 🔢":"Owner 2FA removed"); }
function delTeamMember(id){ if(!needTeam())return; const m=team.find(x=>x.id===id); if(!m)return; if(!confirm("Remove "+m.name+"?"))return; team=team.filter(x=>x.id!==id); store.set("nukto.team",team); saveAll(); render(); toast("Member removed"); }
function downloadCSV(name,rows){
  const csv=rows.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(",")).join("\n");
  if(typeof Blob==="undefined"||typeof URL==="undefined"||!URL.createObjectURL) return csv;
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=name; a.click(); return csv;
}
function exportOrdersCSV(){
  const rows=[["Order","Customer","Phone","Address","Items","Total","Payment","Pay Status","Order Status","TID","Date"]];
  orders.forEach(o=>rows.push([o.id,o.name||"",o.phone||"",(o.address||"").replace(/\s+/g," "),(o.items||[]).map(i=>i.qty+"x "+i.name).join("; "),o.total,o.pm,o.paymentStatus,o.orderStatus,o.payRef||"",o.date||""]));
  const csv=downloadCSV("mkca-orders.csv",rows); toast("📥 Orders CSV export ho gaya ("+(orders.length)+" orders)"); return csv;
}
function exportProductsCSV(){

function restockItems(o){ (o.items||[]).forEach(i=>{ const pr=prod(i.id); if(pr) pr.stock=(pr.stock||0)+(i.qty||1); }); }
const ORDER_FLOW={pending:["processing","shipped","delivered","cancelled","returned"],processing:["shipped","delivered","cancelled","returned"],shipped:["delivered","returned"],delivered:["returned"],cancelled:[],returned:["refunded"],refunded:[]};
function setOrderStatus(id,s){ const o=orders.find(x=>x.id===id); if(o){ const prev=o.orderStatus||"pending";
    if(prev!==s && ORDER_FLOW[prev] && !ORDER_FLOW[prev].includes(s)){ toast("Not allowed: "+prev+" \u2192 "+s); return; }
    logAct("order "+id+" \u2192 "+s+" (was "+prev+") by "+(session?session.name:"admin")); o.orderStatus=s;
    if((s==="cancelled"||s==="returned")&&prev!=="cancelled"&&prev!=="returned"){ restockItems(o); logAct("stock restored for "+id); } notifyCustomer(o,"Salaam! Aapka order "+id+" ab ["+s+"] stage par hai. — "+settings.storeName); } saveAll(); render(); toast("Order "+id+" → "+s+" · customer notified 🔔"); }

function approveTxn(id){
  const t=txns.find(x=>x.id===id); if(!t) return;
  if(t.status==="approved"){ toast("Already approved"); return; }
  if(!t.userId){ toast("This request has no linked account — ask the customer to submit it again after logging in"); return; }
  t.status="approved"; t.approvedOn=new Date().toISOString().slice(0,10);
  const bal=reconcileUserBalance(t.userId);
  saveAll(); pushCloud(false); render();
  toast("Approved — "+fmt2(t.amount)+" added to "+(t.userName||"customer")+" (balance "+fmt2(bal||0)+") ✅");
}
function rejectTxn(id){ const t=txns.find(x=>x.id===id); if(!t) return; if(t.status==="approved"){ toast("Already approved — cannot reject"); return; } t.status="rejected"; saveAll(); pushCloud(false); render(); toast("Rejected"); }
