/* ---------- ANALYTICS (views, best-sellers, abandoned carts, conversions) ---------- */
function adminAnalytics(){
  const views=analytics.views||0, addCarts=analytics.addCarts||0;
  const ordersN=analytics.orders||0;
  const conv = addCarts? Math.round(ordersN/addCarts*100) : 0;
  // Best sellers from analytics.addToCart + order items
  const counts={};
  Object.entries(analytics.addToCart||{}).forEach(([id,n])=>{counts[id]=(counts[id]||0)+n;});
  orders.forEach(o=>o.items.forEach(it=>{counts[it.id]=(counts[it.id]||0)+it.qty;}));
  const best=Object.entries(counts).map(([id,n])=>({p:prod(id),n})).filter(x=>x.p).sort((a,b)=>b.n-a.n).slice(0,15);
  const pv=Object.entries(analytics.productViews||{}).map(([id,n])=>({p:prod(id),n})).filter(x=>x.p).sort((a,b)=>b.n-a.n).slice(0,15);
  // Abandoned carts = items added to cart but never ordered
  const orderedIds=new Set(); orders.forEach(o=>o.items.forEach(it=>orderedIds.add(it.id)));
  const abandonedProd=Object.entries(analytics.addToCart||{}).map(([id,n])=>({p:prod(id),n})).filter(x=>x.p&&!orderedIds.has(x.p.id)).sort((a,b)=>b.n-a.n).slice(0,15);
  const abandPct = addCarts? Math.round(abandonedProd.reduce((a,x)=>a+x.n,0)/addCarts*100):0;
  return adminLayout(`
    <h1 style="margin-top:0">📈 Analytics</h1>
    <div class="stats">
      <div class="stat"><div class="l">Page Views</div><div class="v">${views.toLocaleString()}</div></div>
      <div class="stat"><div class="l">Add to Carts</div><div class="v">${addCarts.toLocaleString()}</div></div>
      <div class="stat"><div class="l">Orders Placed</div><div class="v">${ordersN.toLocaleString()}</div></div>
      <div class="stat"><div class="l">Conversion Rate</div><div class="v">${conv}%</div></div>
      <div class="stat"><div class="l">Abandoned Cart %</div><div class="v">${abandPct}%</div></div>
      <div class="stat"><div class="l">Total Revenue</div><div class="t">${fmt2(orders.filter(o=>o.paymentStatus==="verified").reduce((a,o)=>a+o.total,0))}</div></div>
    </div>
    <div class="two" style="margin-top:20px;grid-template-columns:1fr 1fr">
      <div class="panel"><h3>🏆 Best Sellers</h3>${best.length?`<table><tr><th>Product</th><th>Sold</th></tr>${best.map(x=>`<tr><td class="line-clamp2" style="max-width:230px">${x.p.emoji} <b>${esc(x.p.name)}</b></td><td><b>${x.n}</b></td></tr>`).join("")}</table>`:"<p class='muted'>No sales data yet.</p>"}</div>
      <div class="panel"><h3>👀 Most Viewed</h3>${pv.length?`<table><tr><th>Product</th><th>Views</th></tr>${pv.map(x=>`<tr><td class="line-clamp2" style="max-width:230px">${x.p.emoji} <b>${esc(x.p.name)}</b></td><td><b>${x.n}</b></td></tr>`).join("")}</table>`:"<p class='muted'>No product views yet.</p>"}</div>
    </div>
    <div class="panel" style="margin-top:16px"><h3>🛒 Abandoned Carts (added to cart, not ordered)</h3>
      ${abandonedProd.length?`<table><tr><th>Product</th><th>Times Added</th></tr>${abandonedProd.map(x=>`<tr><td class="line-clamp2" style="max-width:320px">${x.p.emoji} <b>${esc(x.p.name)}</b></td><td><b>${x.n}</b></td></tr>`).join("")}</table>`:"<p class='muted'>No abandoned carts yet.</p>"}
      <p class="muted" style="font-size:12px;margin-top:8px">💡 Tip: send these customers a discount coupon (Coupons) to recover their carts.</p>
    </div>
    <div class="panel" style="margin-top:16px"><h3>📊 Category-wise Sales Report</h3>
      ${(function(){ const cs={}; orders.forEach(o=>(o.items||[]).forEach(it=>{ const pp=prod(it.id); const cat=pp?pp.catLabel:"Other"; const amt=(pp?pp.price:(it.price||0))*it.qty; const e=cs[cat]=cs[cat]||{n:0,rev:0,orders:new Set()}; e.n+=it.qty; e.rev+=amt; e.orders.add(o.id); }));
        const list=Object.entries(cs).sort((a,b)=>b[1].rev-a[1].rev);
        const totRev=list.reduce((a,x)=>a+x[1].rev,0);
        return list.length?`<table><tr><th>Category</th><th>Items Sold</th><th>Orders</th><th>Revenue</th><th>Share</th></tr>${list.slice(0,14).map(([cat,e])=>`<tr><td><b>${esc(cat)}</b></td><td>${e.n}</td><td>${e.orders.size}</td><td><b>${fmt2(e.rev)}</b></td><td>${totRev?Math.round(100*e.rev/totRev):0}%</td></tr>`).join("")}<tr><td><b>TOTAL</b></td><td>${list.reduce((a,x)=>a+x[1].n,0)}</td><td>${orders.length}</td><td><b>${fmt2(totRev)}</b></td><td>100%</td></tr></table>`:"<p class='muted'>Abhi koi sale nahi — orders aane par category-wise report yahan banegi.</p>"; })()}
    </div>`,"analytics");
}

function addCoupon(){
  const code=$id("nc_code").value.trim().toUpperCase(); const type=$id("nc_type").value;
  const value=Number($id("nc_val").value)||0; const minOrder=Number($id("nc_min").value)||0;
  const note=$id("nc_note").value.trim();
  if(!code){toast("Enter a coupon code");return;}
  if(coupons.some(c=>c.code.toUpperCase()===code)){toast("Coupon already exists");return;}
  coupons.unshift({code,type,value,minOrder,active:true,uses:0,maxUses:0,expiry:"",note});
  markStorefrontDirty(); saveAll(); render(); toast("Coupon created 🎟️");
}

function backupData(){
  const data={settings,supabase,coupons,analytics,prodEdit,users,orders,txns,returns,team,catRatios,prodRatios,priceGuard};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="mkca-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click(); URL.revokeObjectURL(a.href);
  toast("Backup downloaded ⬇️");
}
function restoreData(input){
  const f=input.files[0]; if(!f)return;
  const rd=new FileReader(); rd.onload=()=>{ try{
    const d=JSON.parse(rd.result);
    if(d.settings) settings=Object.assign({},DEFAULT_SETTINGS,d.settings);
    if(d.supabase) supabase=d.supabase; if(d.brevo) brevo=d.brevo;
    if(d.coupons) coupons=d.coupons; if(d.analytics) analytics=d.analytics;
    if(d.prodEdit) prodEdit=d.prodEdit; if(d.productDiscounts) productDiscounts=d.productDiscounts; if(d.orders) orders=d.orders; if(d.team) team=d.team; if(d.catRatios) catRatios=d.catRatios; if(d.prodRatios) prodRatios=d.prodRatios; if(d.priceGuard!=null) priceGuard=d.priceGuard;
    if(d.txns) txns=d.txns; if(d.returns) returns=d.returns; if(d.users) users=d.users;
    PRODUCTS=RAW.map(norm); consolidateCatalogProducts(); applyOverrides(); shuffleProducts(); CATEGORIES=buildCategories(); sanitizeCart();
    saveAll(); render(); toast("Backup restored ✅");
  }catch(e){ toast("Invalid backup file ❌"); } };
  rd.readAsText(f);
}

/* ---------- router ---------- */
let debT;
function debRender(){ clearTimeout(debT); debT=setTimeout(render,200); }
let _anaT=null;
function _saveAnalytics(){ clearTimeout(_anaT); _anaT=setTimeout(()=>store.set("nukto.analytics",analytics),400); }
function render(){
  const hash=location.hash.replace("#","");
  let [view,arg]=hash.split(":");
  analytics.views=(analytics.views||0)+1;
  if(view==="product"&&arg){ const _p=resolveProduct(arg); const _k=_p?_p.id:arg;
    analytics.productViews[_k]=(analytics.productViews[_k]||0)+1; }
  _saveAnalytics();
  let content;
  switch(view){
    case "home":content=productsPage("","","");break;   // no separate landing page — the shop IS the home page
    case "products":content=productsPage("",arg,"");break;
    case "search":content=productsPage(safeDecode(arg),"","");break;
    case "category":content=productsPage("",arg,"");break;
    case "tag":activeTag=arg;content=productsPage("",arg&&false,"");break;
    case "sections":content=sectionsPage();break;
    case "categories":content=categoriesPage();break;
    case "product":content=product(arg);break;   // arg = slug (ya legacy raw id)
    case "cart":content=cartView();break;
    case "checkout":content=checkout();break;
    case "confirmation":content=confirmation(arg);break;
    case "reset":content=resetView(arg);break;
    case "login":content=login();break;
    case "signup":content=signup();break;
    case "account":content=account();break;
    case "orders":content=ordersView();break;
    case "wishlist":content=wishlistView();break;
    case "tracking":content=trackingView(arg);break;
    case "complaint":content=complaint();break;
    case "returns":content=returnsView();break;
    case "wallet":content=wallet();break;
    case "settings":content=settings2();break;
    case "support":content=support();break;
    case "contact":content=contact();break;
    case "terms":content=terms();break;
    case "privacy":content=privacyPolicy();break;
    case "shipping":content=shippingPolicy();break;
    case "refund-policy":content=refundPolicy();break;
    case "about":content=about();break;
    case "admin":content=adminRoute(arg);break;
    default:content=productsPage("","","");view="home";
  }
  const isAdmin=view==="admin";
  // Admin = clean shell only: hide the public storefront header, footer, theme FAB/panel, cookie bar.
  const hdr=$id("header"); if(hdr) hdr.style.display=isAdmin?"none":"block";
  $id("footer").style.display=isAdmin?"none":"block";
  const tf=$id("themeFab"); if(tf) tf.style.display="none"; // floating circle removed (confused with WhatsApp button) — themes in Settings
  const tp=$id("themePanel"); if(tp){ if(isAdmin) tp.classList.remove("open"); }
  const cb=$id("cookiebar"); if(cb) cb.style.display=isAdmin?"none":"";
  $id("app").innerHTML=content;
  renderHeader();
  try{ attachFeedObserver(); }catch(e){}   // endless feed: load more as shopper nears the end
  try{ smoothMedia(); }catch(e){}          // pause/play video thumbs only while visible
  $id("loading").style.display="none";
  if(!productsPage._appending) window.scrollTo(0,0);
  // SEO: dynamic titles/descriptions
  // canonical URL har view ke liye (product par slug wala saaf URL)
  (function(){
    const cn=document.querySelector('link[rel="canonical"]'); if(!cn) return;
    const _p = (view==="product"&&arg) ? resolveProduct(arg) : null;
    cn.setAttribute("href", _p ? "https://maneshkumarcommissionagent.dpdns.org/#product:"+productSlug(_p)
      : "https://maneshkumarcommissionagent.dpdns.org/"+(view&&view!=="home"&&view!=="products"?"#"+view:""));
  })();
  if(view==="product"&&arg){ const p=resolveProduct(arg); if(p){
      document.title=decodeHTML(p.name)+" — "+settings.storeName;
      const md=document.querySelector('meta[name="description"]');
      if(md) md.setAttribute("content",decodeHTML(p.desc||p.name).slice(0,150));
    } }
  else if(view==="category"&&arg){ document.title=getCat(arg).name+" — "+settings.storeName; }
  else if(view==="home"){ document.title=settings.storeName+" — "+settings.tagline; }
  else if(view==="checkout"){ document.title="Checkout — "+settings.storeName; }
  else if(view==="cart"){ document.title="Cart — "+settings.storeName; }
  else if(view==="admin"){ document.title="Admin — "+settings.storeName; }
  else if(view==="support"){ document.title="Support — "+settings.storeName; }
  else { document.title=settings.storeName; }
}
window.addEventListener("hashchange",render);

/* ---------- boot ---------- */
let booted=false;
function boot(){
  if(booted) return;
  booted=true;
  try{ applyThemeOnce(); injectThemePanel(); }catch(e){}
  try{ initCatalog(); }catch(e){ console.error("initCatalog:", e); }
  try{ purgeStaleData(); }catch(e){ console.warn("purgeStaleData:", e); }
  try{ reconcileWallet(); }catch(e){}
  render();
  showConsent();
  loadCloud();          // reviews/analytics pull (best-effort)
  pullStorefront();     // global storefront snapshot pull (best-effort, dirty-safe)
}
// show the skeleton while catalog.js (10MB) downloads/parses, then render.
if(document.readyState === "complete") boot();
else window.addEventListener("load", boot);
// safety: never leave the loader visible if 'load' is somehow delayed
setTimeout(function(){ if(!booted) boot(); }, 3500);
</script>
</body>
